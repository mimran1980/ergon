[package]
name = "ergo-sbe-benchmarks"
description = "ergon SBE benchmarks — generates SBE codecs on-the-fly via build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ergo-sbe = { path = ".." }
rust_decimal = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
hdrhistogram = "7"
# iai-callgrind removed (HFT-005): pulled unmaintained proc-macro-error2
# (RUSTSEC-2026-0173). instruction_counts is a dep-free Instant harness.

[build-dependencies]
ergo-sbe = { path = ".." }

[[bench]]
name = "decode_bench"
harness = false

[[bench]]
name = "encode_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false

[[bench]]
name = "perf_parity_bench"
harness = false

[[bench]]
name = "layout_access_bench"
harness = false

[[bench]]
name = "encode_style_bench"
harness = false

[[bench]]
name = "codec_matrix_bench"
harness = false

[[bench]]
name = "alignment_bench"
harness = false

[[bench]]
name = "instruction_counts"
harness = false

[[bench]]
name = "latency_distribution"
harness = false

[[bench]]
name = "cold_path_bench"
harness = false
[[bench]]
name = "group_encode_bench"
harness = false
[[bench]]
name = "l2_book_bench"
harness = false
[[bench]]
name = "group_encode_decimal_bench"
harness = false

[features]
default = []

[lints]
workspace = true
