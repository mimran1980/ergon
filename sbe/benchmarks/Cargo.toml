[package]
name = "ergo-sbe-benchmarks"
description = "ergon SBE benchmarks — generates SBE codecs on-the-fly via build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ergo-sbe = { path = ".." }
rust_decimal = "1"
compact_str = { version = "0.8", optional = true }
smol_str = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
hdrhistogram = "7"

[build-dependencies]
ergo-sbe = { path = ".." }

[[bench]]
name = "decode_bench"
harness = false

[[bench]]
name = "encode_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false

[[bench]]
name = "perf_parity_bench"
harness = false

[[bench]]
name = "layout_access_bench"
harness = false

[[bench]]
name = "encode_style_bench"
harness = false

[[bench]]
name = "codec_matrix_bench"
harness = false

[[bench]]
name = "alignment_bench"
harness = false

[[bench]]
name = "instruction_counts"
harness = false

[[bench]]
name = "latency_distribution"
harness = false

[[bench]]
name = "cold_path_bench"
harness = false
[[bench]]
name = "group_encode_bench"
harness = false
[[bench]]
name = "l2_book_bench"
harness = false
[[bench]]
name = "group_encode_decimal_bench"
harness = false
[[bench]]
name = "var_data_types_bench"
harness = false
[[bench]]
name = "chrono_converter_bench"
harness = false

[features]
default = []
compact_str = ["ergo-sbe/compact_str", "dep:compact_str"]
smol_str = ["ergo-sbe/smol_str", "dep:smol_str"]
bytes = ["ergo-sbe/bytes", "dep:bytes"]
chrono = ["ergo-sbe/chrono", "dep:chrono"]

[lints]
workspace = true
