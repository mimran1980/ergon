[package]
name = "ergo-sbe"
description = "Simple Binary Encoding (SBE) — opinionated, idiomatic Rust code generation for low-latency trading protocols."
keywords = ["sbe", "codegen", "binary", "protocol", "simplebinaryencoding"]
categories = ["encoding", "parser-implementations", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = [
    "src/**/*.rs",
    "src/**/*.xsd",
    "README.md",
    "Cargo.toml",
]

[lib]
path = "src/lib.rs"

[features]
default = ["fancy"]
# Renders schema parse errors with a source snippet + span. Opt out with
# `default-features = false` to skip terminal/backtrace deps (plain fallback).
fancy = ["miette/fancy"]
# Domain DTO var-data: inline short strings (≤24 bytes) on the stack.
compact_str = ["dep:compact_str"]
# Domain DTO var-data: O(1)-clone short strings, good for long-lived DTOs.
smol_str = ["dep:smol_str"]
# Domain DTO var-data: zero-copy shared buffer slices via the `bytes` crate.
bytes = ["dep:bytes"]
# Converter: `chrono::DateTime<Utc>` / `chrono::NaiveDateTime` for timestamp
# semantic types. Use `with_domain_type(SemanticType("UTCTimestamp"), "chrono::DateTime<chrono::Utc>")`.
chrono = ["dep:chrono"]

[dependencies]
roxmltree = "0.21"
thiserror = "2"
miette = { version = "7", features = ["derive"] }
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.3"
sha2 = "0.11"
compact_str = { version = "0.8", optional = true }
smol_str = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }

[[test]]
name = "smoke_test"

[[test]]
name = "baseline_test"

[[test]]
name = "benchmark_test"

[[test]]
name = "error_validation_test"

[[test]]
name = "integration_tests"

[[test]]
name = "issue_regression_test"

[[test]]
name = "proptest_roundtrip"

[[test]]
name = "schema_edge_cases_test"

[[test]]
name = "stability_test"

[[test]]
name = "java_parity_features_test"

[[test]]
name = "docs_validation_test"

[[test]]
name = "sbe_tool_wire_parity_test"

[[test]]
name = "sbe_tool_multi_schema_wire_parity_test"

[[test]]
name = "soundness_hostile_constructors_test"

[[test]]
name = "stale_interface_test"

[[test]]
name = "typestate_budgets_test"

[[test]]
name = "checked_unchecked_parity_test"

[[test]]
name = "generation_profile_test"

[[test]]
name = "warning_free_consumer_test"

[[test]]
name = "fix_sbe_conformance_test"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "=1.11.0"
serial_test = "3"
toml = "1.1"
# fancy-no-backtrace (not "fancy"): GraphicalReportHandler for tests proving
# the miette rendering pipeline actually snippets — skips the heavier
# backtrace/backtrace-ext deps that "fancy" pulls in.
miette = { version = "7", features = ["fancy-no-backtrace"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
