[package]
name = "ergo-sbe"
description = "Opinionated, idiomatic Rust code generation for Simple Binary Encoding."
keywords = ["sbe", "codegen", "binary", "protocol", "simplebinaryencoding"]
categories = ["encoding", "parser-implementations", "development-tools"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = [
    "src/**/*.rs",
    "src/**/*.xsd",
    "README.md",
    "Cargo.toml",
]

[lib]
path = "src/lib.rs"

[features]
default = ["fancy"]
# Renders schema parse errors with a source snippet + span. Opt out with
# `default-features = false` to skip terminal/backtrace deps (plain fallback).
fancy = ["miette/fancy"]
# Removed: bound-check-disabled provided negligible ~1% gain.
# LLVM elides bounds checks for constant-sized accesses on visible
# stack buffers. unchecked companions are always generated.
# Removed: serde — DTOs are for app logic + SBE re-encode; JSON/etc. is app-owned.

[dependencies]
roxmltree = "0.20"
thiserror = "2"
miette = { version = "7", features = ["derive"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
sha2 = "0.10"

[[test]]
name = "smoke_test"

[[test]]
name = "baseline_test"

[[test]]
name = "benchmark_test"

[[test]]
name = "error_validation_test"

[[test]]
name = "integration_tests"

[[test]]
name = "issue_regression_test"

[[test]]
name = "proptest_roundtrip"

[[test]]
name = "schema_edge_cases_test"

[[test]]
name = "stability_test"

[[test]]
name = "java_parity_features_test"

[[test]]
name = "docs_validation_test"

[[test]]
name = "sbe_tool_wire_parity_test"

[[test]]
name = "sbe_tool_multi_schema_wire_parity_test"

[[test]]
name = "hft_001_soundness_test"

[[test]]
name = "hft_stale_interface_test"

[[test]]
name = "hft_006_typestate_budgets_test"

[[test]]
name = "hft_008_checked_unchecked_test"

[[test]]
name = "hft_009_profile_test"

[[test]]
name = "hft_005_warning_free_consumer_test"

[[test]]
name = "fix_sbe_conformance_test"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3"
toml = "0.8"
# fancy-no-backtrace (not "fancy"): GraphicalReportHandler for tests proving
# the miette rendering pipeline actually snippets — skips the heavier
# backtrace/backtrace-ext deps that "fancy" pulls in.
miette = { version = "7", features = ["fancy-no-backtrace"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
