[package]
name = "ergon-runtime-server"
description = "Ingest recorded SBE messages from the Aeron Archive into ClickHouse tables derived from the SBE schema."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ingester"
path = "src/main.rs"

[dependencies]
hdrhistogram = "7"
jiff = { version = "0.2", default-features = false, features = ["std"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
ergo-sbe = { workspace = true }
log = "0.4"
mimalloc = "0.1.52"
ergon-runtime = { path = "../runtime" }
rusteron-archive = { workspace = true }
signal-hook = "0.3"
ureq = { version = "2", default-features = false }

[dev-dependencies]
schema = { path = "../samples/clickhouse/schema" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }

[build-dependencies]
ergo-sbe = { workspace = true }

[lints]
workspace = true
