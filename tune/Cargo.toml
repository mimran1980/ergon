[package]
name = "ergon-tune"
description = "Start-up and housekeeping checks of a host's low-latency settings (CPU isolation, NIC interrupts, transparent hugepages, the Aeron directory, NUMA, scheduling policy, SMT siblings, a CPU quota and its throttling, how CLOCK_REALTIME is kept and the kernel's clock source, background noise on the hot CPUs (unbound workqueues, compaction, other processes' tasks, kernel instrumentation, KSM, steal), a hot thread's page faults, the IRQ CPUs' idle depth and TCP autocorking, and with `nic` the NIC's moderation, deferral, VF and ring): pure functions returning findings, with no threads or statics, and one audited unsafe call (a read-only adjtimex)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/ergon-tune"
keywords = ["latency", "tuning", "isolcpus", "irq", "ethtool"]
categories = ["os::linux-apis", "hardware-support"]
# Published (ergon-md-dpdk depends on it) as the library only: the tests and
# their fixture trees are repo-only. Its callers are ergon-io (the
# ergon-io-warn thread), the ergon-md-dpdk media driver (start-up,
# housekeeping) and an application's busy-spinning runtime (before its loop);
# see the crate documentation.
include = [
    "/Cargo.toml",
    "/README.md",
    "/src/**/*.rs",
]

[features]
default = []
# The NIC checks N1-N4. N1 and N4 ask the kernel over generic netlink
# (ethtool's COALESCE_GET and RINGS_GET, unprivileged); a runtime with no
# NIC of its own need not link them.
nic = ["rustix/net"]

# rustix is already in the workspace's lock (tempfile, terminal_size). It is
# the only dependency: `statfs` for the Aeron directory's filesystem (T4),
# the netlink socket (N1, N4) and `CLOCK_MONOTONIC_COARSE` (T11's ClockBound
# age) without `unsafe` here. rustix has no `adjtimex` yet, so T11 declares
# the C library's itself: the crate's one `unsafe` call, in
# src/time/kernel.rs, removed once rustix wraps it. Linux only: elsewhere
# every reader reports unknown ("not Linux").
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "time"] }

# The NIC checks on docs.rs too.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
