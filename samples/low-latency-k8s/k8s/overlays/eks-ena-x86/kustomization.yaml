# SPDX-License-Identifier: Apache-2.0
# EKS on AL2023 with the ENA pair: 2 x c7i.4xlarge, the smallest c7i with 5 physical cores. Render and lint only: not run.
# No c7i.2xlarge layout is written: with SMT off it has 4 cores, and the
# ping node's driver (2), app (1) and reserved (1) cores fill all 4.
# The image runs only on its CPU family (SIGILL elsewhere): the node affinity
# keeps it on c7i.4xlarge. Fill endpoints.env with each node's receiver ENA IP
# before applying: the ping publishes to the pong node's receiver and
# subscribes on its own, the pong the other way round.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
components:
  - ../../components/hot
  - ../../components/ena-driver
  - ../../components/dpdk-ena-device-plugin
# REGISTRY is a placeholder no node can pull: push both images to your
# registry, then replace it (samples/README.md, quick start step 6):
#   sed -i.orig "s|REGISTRY/|$REG/|" k8s/overlays/eks-ena-x86/kustomization.yaml
images:
  - {name: ll, newName: REGISTRY/ll, newTag: amd64-v3}
  - {name: rusteron-dpdk-device-plugin, newName: REGISTRY/rusteron-dpdk-device-plugin, newTag: 0.1.34-amd64}
configMapGenerator:
  - name: ll-endpoints
    namespace: trading
    behavior: replace
    envs: [endpoints.env]
  - name: ll-app
    namespace: trading
    behavior: merge
    literals: [LL_OVERLAY=eks-ena-x86]
patches:
  - target: {kind: Job, name: ll-ping}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector/ergon.io~1ll-role
        value: ping
  - target: {kind: Deployment, name: ll-pong}
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector/ergon.io~1ll-role
        value: pong
  # the ENA nodes are tainted rusteron-dpdk (md-dpdk/deploy/aws-eks)
  - target: {kind: Deployment|Job}
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - {key: rusteron-dpdk, operator: Exists, effect: NoSchedule}
  - target: {kind: DaemonSet|Deployment|Job}
    patch: |-
      - op: add
        path: /spec/template/spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - {key: node.kubernetes.io/instance-type, operator: In, values: [c7i.4xlarge]}
                    - {key: kubernetes.io/arch, operator: In, values: [amd64]}
