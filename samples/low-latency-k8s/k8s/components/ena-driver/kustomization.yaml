# SPDX-License-Identifier: Apache-2.0
# The driver on an ENA pair from md-dpdk's device plugin (rusteron.io/dpdk-ena-pair),
# which injects RUSTERON_DPDK_SENDER_{PCI,IPV4_CIDR,GATEWAY} at allocation: the
# plugin is what fills PCI, address and gateway for the Aeron driver.
# The shortest lines built from that pair (samples/README.md, aws-k8s):
#   fstack-spin,fstack_addr=10.0.1.20,fstack_gateway=10.0.1.1,fstack_pci=0000:00:06.0
#   port=0000:00:06.0,ip=10.0.1.20/24,eal=-a 0000:00:06.0
# A container granted the pair runs ergon-io with just "fstack-spin" (or an
# empty smoltcp line): a line that names no NIC copies the pair itself.
# The ERGON_IO_FSTACK/ERGON_DPDK_* copies appear only when the pod sets
# dpdk.ergon.io/<container>: "ena-pair" (the NRI plugin, default off).
# Lab only (md-dpdk/BENCHMARKS.md: kernel UDP in production).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  # the report's nic=
  - name: ll-app
    namespace: trading
    behavior: merge
    literals: [LL_NIC=ena]
patches:
  - target: {kind: DaemonSet, name: ll-media-driver}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/rusteron.io~1dpdk-ena-pair
        value: "1"
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/rusteron.io~1dpdk-ena-pair
        value: "1"
      - op: add
        path: /spec/template/spec/nodeSelector/rusteron-dpdk~1ena
        value: "true"
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - {key: rusteron-dpdk, operator: Exists, effect: NoSchedule}
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          # vfio-pci's write-combining, as the node's preflight confirmed it
          # (md-dpdk/deploy/aws-eks/media-driver-config.yaml)
          - {name: RUSTERON_DPDK_VFIO_WC, value: "1"}
