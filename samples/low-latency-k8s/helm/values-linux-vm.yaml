# ergon-shared-cpus for kind on a Linux VM prepared by node/linux-vm-prep.sh
# the kubelet reserves CPUs 0-1, CPU 0 takes the IRQs, CPU 1 is the shared
# CPU every helper runs on. Works with chart 0.1.1 (GHCR) and 0.1.2 (git).
#   driver 500 + ping 100 + pong 100 = 700 of the 1000 shared millicpus.
config:
  sharedCpus: "1"
  oversubscription: 1
  namespaces: [trading, trading-driver]
  defaultAffinity: shared
hostContract:
  kubeletConfig:
    enabled: true
  sys:
    enabled: true
  proc:
    enabled: true
