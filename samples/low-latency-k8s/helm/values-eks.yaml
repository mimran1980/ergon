# ergon-shared-cpus on EKS AL2023 nodes prepared by node/eks-nodeconfig.yaml
# (c9g.2xlarge: 8 CPUs, reservedSystemCPUs 0-1, IRQs on 0, shared CPU 1).
# Needs chart 0.1.2 (in git, not published): nodeadm's kubelet config is
# /etc/kubernetes/kubelet/config.json plus the config.json.d drop-ins.
# Not run on EKS.
config:
  sharedCpus: "1"
  oversubscription: 1
  namespaces: [trading, trading-driver]
  defaultAffinity: shared
hostContract:
  kubeletConfig:
    enabled: true
    path: /etc/kubernetes/kubelet/config.json
  kubeletConfigDir:
    enabled: true
  sys:
    enabled: true
  proc:
    enabled: true
