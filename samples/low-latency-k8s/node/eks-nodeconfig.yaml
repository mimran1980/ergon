# SPDX-License-Identifier: Apache-2.0
# The nodeadm NodeConfig part of an EKS AL2023 node's user data for this
# sample (c9g.2xlarge: 8 CPUs, no SMT): md-dpdk/deploy/aws-eks/node/userdata.sh's
# kubelet settings with reservedSystemCPUs 0-1, plus what that file lacks:
# containerd's NRI with the default validator, and the ergon.io labels.
#
# Do not paste it by hand: node/eks-userdata.sh builds the whole user data,
# running userdata.sh as
#   userdata.sh <cluster> <endpoint> <ca> <cidr> 0-1 0
# (housekeeping CPUs 0-1, IRQs on 0, so the shared CPU 1 is not isolated)
# and swapping its NodeConfig part for this one with the placeholders
# filled in. userdata.sh's own example ("0") would isolate CPU 1.
#
# Not run as written. The plugin's EKS lane (k8s/nri-shared-cpus/RELEASE.md,
# chart 0.1.2 on c8g.xlarge) verified what this file relies on: AL2023's
# containerd (2.3.5; the required-plugins annotation needs >= 2.2), nodeadm's
# merge of a containerd block like the one below, and the plugin's NRI
# connection.
---
apiVersion: node.eks.aws/v1alpha1
kind: NodeConfig
spec:
  cluster:
    name: CLUSTER_NAME
    apiServerEndpoint: API_SERVER_ENDPOINT
    certificateAuthority: CA_BASE64
    cidr: SERVICE_CIDR
  containerd:
    config: |
      [plugins."io.containerd.nri.v1.nri"]
        disable = false
      [plugins."io.containerd.nri.v1.nri".default_validator]
        enable = true
  kubelet:
    config:
      cpuManagerPolicy: static
      cpuManagerPolicyOptions:
        full-pcpus-only: "true"
      reservedSystemCPUs: "0-1"
      kubeReservedCgroup: ""
      systemReservedCgroup: ""
      topologyManagerPolicy: single-numa-node
      topologyManagerScope: pod
      memoryManagerPolicy: None
    flags:
      # ll-role: ping on one node, pong on the other
      - --node-labels=rusteron-dpdk/ena=true,ergon.io/shared-cpus=true,ergon.io/ll-driver=true,ergon.io/ll-app=true,ergon.io/ll-role=LL_ROLE
      - --register-with-taints=rusteron-dpdk=true:NoSchedule
