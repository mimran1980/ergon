[package]
name = "sbe-feature-tour"
version = "0.1.0"
edition = "2024"
publish = false
description = "ErgoSBE feature tour — EncodedLength, encode/decode stages, DTO, AnyMessage (schema + generated codecs)"

[dependencies]
# Build-dep only; generated codecs embed sbe_rt (no runtime ergo-sbe).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Used only with with_conversion(Decimal) demos (generic price_as / price_from).
rust_decimal = { version = "1", default-features = false, features = ["std"] }

[build-dependencies]
ergo-sbe = { path = "../../sbe" }

[[bin]]
name = "sbe-feature-tour"
path = "src/main.rs"
