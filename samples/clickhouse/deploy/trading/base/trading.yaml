# A region's engine and dummy exchange, written once. deploy/trading/<region>/
# names them engine-<region> and exch-sim-<region>, labels them with the
# region (which REGION reads) and pins them to it.

---
# A region's trading engine: every feed handler in its region, the aggregated
# book, EMAs, orders and tick-to-trade, in one loop on one thread.
#
# On the node's network, like md (deploy/md/base): its Service's name
# resolves to its node's media driver. One replica, recreated rather than
# rolled; on SIGTERM it closes its feeds at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  labels: { app: engine }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: engine } }
  template:
    metadata: { labels: { app: engine } }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      initContainers:
        - name: wait-for-aeron
          image: lab/app:local
          imagePullPolicy: Never
          command: [sh, -c, "until [ -f /aeron/driver/cnc.dat ]; do sleep 1; done"]
          volumeMounts: [{ name: aeron, mountPath: /aeron }]
      containers:
        - name: engine
          image: lab/app:local
          imagePullPolicy: Never
          command: [/usr/local/bin/engine]
          env:
            # From its pod's `region` label, which deploy/trading/<region> sets.
            - name: REGION
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['region']" } }
            - { name: PERSIST_APP, value: engine-$(REGION) }
            - { name: AERON_DIR, value: /aeron/driver }
            - { name: AERON_DRIVER_TIMEOUT, value: "30000" }
            - { name: PERSIST_CONFIG, value: /lab/config/tables.yaml }
            - { name: PERSIST_STREAMS, value: /lab/config/streams.yaml }
            - { name: PERSIST_SUBSCRIBER_TIMEOUT, value: 60s }
            # Its loop's idle strategy: spin, noop, yield or sleep. The lab
            # sleeps (up to 1 ms late, almost no CPU) so four nodes share one
            # machine; spin on an isolated core for real tick-to-trade.
            - { name: IDLE, value: sleep }
            - { name: MALLOC_ARENA_MAX, value: "1" }
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources: { requests: { memory: 16Mi }, limits: { memory: 64Mi } }
          volumeMounts:
            - { name: aeron, mountPath: /aeron }
            - { name: config, mountPath: /lab/config, readOnly: true }
      volumes:
        - name: aeron
          hostPath: { path: /tmp/lab-aeron, type: DirectoryOrCreate }
        - name: config
          configMap: { name: lab-config }
---
# Its name, engine-<region>.lab.svc.cluster.local: headless, so it resolves
# to the pod's IP, which is its node's.
apiVersion: v1
kind: Service
metadata:
  name: engine
  labels: { app: engine }
spec:
  clusterIP: None
  selector: { app: engine }
  publishNotReadyAddresses: true
---
# A region's dummy exchange: it fills its region's engine's orders.
#
# On the node's network, like md (deploy/md/base): its Service's name
# resolves to its node's media driver. One replica, recreated rather than
# rolled; on SIGTERM it closes its feeds at once.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exch-sim
  labels: { app: exch-sim }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: exch-sim } }
  template:
    metadata: { labels: { app: exch-sim } }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      initContainers:
        - name: wait-for-aeron
          image: lab/app:local
          imagePullPolicy: Never
          command: [sh, -c, "until [ -f /aeron/driver/cnc.dat ]; do sleep 1; done"]
          volumeMounts: [{ name: aeron, mountPath: /aeron }]
      containers:
        - name: exch-sim
          image: lab/app:local
          imagePullPolicy: Never
          command: [/usr/local/bin/exch-sim]
          env:
            # From its pod's `region` label, which deploy/trading/<region> sets.
            - name: REGION
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['region']" } }
            - { name: PERSIST_APP, value: exch-sim-$(REGION) }
            - { name: AERON_DIR, value: /aeron/driver }
            - { name: AERON_DRIVER_TIMEOUT, value: "30000" }
            - { name: PERSIST_CONFIG, value: /lab/config/tables.yaml }
            - { name: PERSIST_STREAMS, value: /lab/config/streams.yaml }
            - { name: PERSIST_SUBSCRIBER_TIMEOUT, value: 60s }
            # Its loop's idle strategy: spin, noop, yield or sleep. The lab
            # sleeps (up to 1 ms late, almost no CPU) so four nodes share one
            # machine; spin on an isolated core for real tick-to-trade.
            - { name: IDLE, value: sleep }
            - { name: MALLOC_ARENA_MAX, value: "1" }
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources: { requests: { memory: 16Mi }, limits: { memory: 64Mi } }
          volumeMounts:
            - { name: aeron, mountPath: /aeron }
            - { name: config, mountPath: /lab/config, readOnly: true }
      volumes:
        - name: aeron
          hostPath: { path: /tmp/lab-aeron, type: DirectoryOrCreate }
        - name: config
          configMap: { name: lab-config }
---
# Its name, exch-sim-<region>.lab.svc.cluster.local: headless, so it resolves
# to the pod's IP, which is its node's.
apiVersion: v1
kind: Service
metadata:
  name: exch-sim
  labels: { app: exch-sim }
spec:
  clusterIP: None
  selector: { app: exch-sim }
  publishNotReadyAddresses: true
