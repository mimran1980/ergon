# The feed handler, written once. deploy/md/<exchange>/ names it and pins the region.
# Host network, so its Service name resolves to the node's driver. It checks
# POD_IP equals HOST_IP. One replica, Recreate. SIGTERM closes the feeds.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: md
  labels: { app: md }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: md } }
  template:
    metadata: { labels: { app: md } }
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      # Only the control plane's taint: tolerating everything would also
      # tolerate a cordon, and a moved pod would land back on its node.
      tolerations: [{ key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }]
      initContainers:
        - name: wait-for-aeron
          image: lab/app
          imagePullPolicy: Never
          command: [sh, -c, "until [ -f /aeron/driver/cnc.dat ]; do sleep 1; done"]
          volumeMounts: [{ name: aeron, mountPath: /aeron }]
      containers:
        - name: md
          image: lab/app
          imagePullPolicy: Never
          command: [/usr/local/bin/md]
          env:
            # From its pod's `exchange` label, which deploy/md/<exchange> sets.
            - name: EXCHANGE
              valueFrom: { fieldRef: { fieldPath: "metadata.labels['exchange']" } }
            # Its entry in config/streams.yaml, and its app name for the
            # tables' `apps` switches in tables.yaml.
            - { name: SERVICE, value: md-$(EXCHANGE) }
            - { name: PERSIST_APP, value: $(EXCHANGE) }
            - { name: AERON_DIR, value: /aeron/driver }
            - { name: AERON_DRIVER_TIMEOUT, value: "30000" }
            - { name: PERSIST_CONFIG, value: /lab/config/tables.yaml }
            - { name: PERSIST_STREAMS, value: /lab/config/streams.yaml }
            # How long to wait at start for the node's archive to record this
            # app's stream: while the node's ingester restarts, it is behind.
            - { name: PERSIST_SUBSCRIBER_TIMEOUT, value: 60s }
            # Idle strategy of the threads md owns (the metrics poller):
            # spin, noop, yield or sleep. Its market data arrives on
            # NautilusTrader's runtime, which this does not change.
            - { name: IDLE, value: sleep }
            - name: HOST_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            # On the node's network HOSTNAME is the node's name, not the pod's.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          resources: { requests: { memory: 64Mi }, limits: { memory: 256Mi } }
          volumeMounts:
            - { name: aeron, mountPath: /aeron }
            - { name: config, mountPath: /lab/config, readOnly: true }
      volumes:
        - name: aeron
          hostPath: { path: /tmp/lab-aeron, type: DirectoryOrCreate }
        # config/ (kustomization.yaml): the kubelet updates it in place, a
        # minute or so after a change, and md re-reads it.
        - name: config
          configMap: { name: lab-config }
---
# The feed handler's name, md-<exchange>.lab.svc.cluster.local: headless, so
# it resolves to the pod's IP, which is its node's, even before it is ready.
apiVersion: v1
kind: Service
metadata:
  name: md
  labels: { app: md }
spec:
  clusterIP: None
  selector: { app: md }
  publishNotReadyAddresses: true
