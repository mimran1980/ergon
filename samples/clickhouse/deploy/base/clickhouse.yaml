apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app: clickhouse
spec:
  clusterIP: None
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
    - name: native
      port: 9000
---
# Crash recovery. When the Docker VM's disk filled on 2026-09-21 the server was
# killed mid-write, and on the next start it refused to attach
# `market.ingest_trades_l1` with `Suspiciously many (457 parts, 0.00 B in total)
# broken parts ... maximum allowed broken parts count is 100`. The parts are
# *empty* — the writes never landed — so removing them costs nothing, and the
# default of 100 turns an empty-parts crash into an unattachable table whose
# view then breaks every query against it. Raised rather than left at the
# default so a crash-while-full is recoverable; it is not a correctness knob.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-configd
data:
  max-suspicious-broken-parts.xml: |
    <clickhouse>
        <merge_tree>
            <max_suspicious_broken_parts>10000</max_suspicious_broken_parts>
        </merge_tree>
    </clickhouse>
  # A cluster left running unattended in live mode for ~19 hours hit its 6Gi
  # memory limit and crash-looped the ingester — not from `market` data (2Gi)
  # but from ClickHouse's OWN internal diagnostic tables: `text_log` alone
  # was 3.58 GiB / 91M rows, because the stock image ships `<logger><level>
  # trace</level></logger>`, mirrored at the same verbosity into
  # `system.text_log`, with no retention on any of it. Two independent fixes,
  # not one: this file lowers future verbosity and gives every system log
  # table a bound; `ALTER TABLE system.<t> MODIFY TTL` was also run directly
  # against the live tables for immediate effect (config.d only takes hold on
  # table *creation*, so a config-only fix would have left the already-bloated
  # tables exactly as bloated).
  log-retention.xml: |
    <clickhouse>
        <logger>
            <level>information</level>
        </logger>
        <text_log>
            <ttl>event_date + INTERVAL 1 DAY</ttl>
        </text_log>
        <trace_log>
            <ttl>event_date + INTERVAL 1 DAY</ttl>
        </trace_log>
        <query_log>
            <ttl>event_date + INTERVAL 1 DAY</ttl>
        </query_log>
        <part_log>
            <ttl>event_date + INTERVAL 1 DAY</ttl>
        </part_log>
        <processors_profile_log>
            <ttl>event_date + INTERVAL 1 DAY</ttl>
        </processors_profile_log>
        <metric_log>
            <ttl>event_date + INTERVAL 1 DAY</ttl>
        </metric_log>
        <asynchronous_metric_log>
            <ttl>event_date + INTERVAL 1 DAY</ttl>
        </asynchronous_metric_log>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          env:
            - name: CLICKHOUSE_USER
              value: default
            # The whole local contract (harness, scripts, notebooks, the
            # Grafana datasource) authenticates as default/ergo_test. Leaving
            # this unset made the server accept *no* credentials but reject any
            # supplied one, so every configured client failed with 516.
            - name: CLICKHOUSE_PASSWORD
              value: ergo_test
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: logs
              mountPath: /var/log/clickhouse-server
            # `subPath`, not a bare directory mount. Mounting the ConfigMap
            # over `config.d` **shadows** the files the image already puts
            # there — including `docker_related_config.xml`, which is what sets
            # `listen_host`. Without it ClickHouse binds to localhost only: the
            # pod's own IP refused connections, the readiness probe failed
            # forever, and the ClusterIP Service kept an empty endpoint list, so
            # nothing in the cluster could reach `clickhouse:8123` while
            # `kubectl port-forward` answered `/ping` perfectly. Projecting the
            # one file leaves the rest of the directory intact.
            - name: configd
              mountPath: /etc/clickhouse-server/config.d/max-suspicious-broken-parts.xml
              subPath: max-suspicious-broken-parts.xml
            - name: configd
              mountPath: /etc/clickhouse-server/config.d/log-retention.xml
              subPath: log-retention.xml
          # 2Gi sized this for the fixture profile, where a run inserts a
          # bounded burst and stops. Live is not bounded: a public L2 MBP feed
          # for two symbols inserts continuously, and at 2Gi the server began
          # rejecting the ingester's own inserts —
          # `DB::Exception: Memory limit (total) exceeded: would use 1.85 GiB
          # ... maximum: 1.80 GiB`, a 4.7 MB `INSERT INTO ingest_l2_books_l5`
          # being the query that pushed it over — after ~10k trades. The daemon
          # has 16 GiB and runs nothing else this size.
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "6Gi"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: configd
          configMap:
            name: clickhouse-configd
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: logs
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# Database bootstrap: the ingester creates `market` too (CREATE DATABASE IF
# NOT EXISTS), but the Grafana ClickHouse datasource and the notebooks need it
# to exist before any ingestion has run — otherwise every query fails with
# "Database market does not exist". Idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.10.1
          env:
            - name: CLICKHOUSE_USER
              value: default
            - name: CLICKHOUSE_PASSWORD
              value: ergo_test
          command:
            - sh
            - -c
            - |
              set -e
              # DDL over HTTP must be POSTed: a GET is read-only and the
              # server rejects CREATE with "Cannot execute query in readonly
              # mode" (code 164).
              for i in $(seq 1 30); do
                code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                  --data-binary "CREATE DATABASE IF NOT EXISTS market" \
                  -u "$CLICKHOUSE_USER:$CLICKHOUSE_PASSWORD" \
                  "http://clickhouse:8123/" || true)
                [ "$code" = "200" ] && echo "database ready ($code)" && exit 0
                echo "waiting for ClickHouse ($code)"; sleep 2
              done
              echo "database init failed" && exit 1
