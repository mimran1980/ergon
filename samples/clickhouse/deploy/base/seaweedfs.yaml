apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  labels:
    app: seaweedfs-s3
spec:
  clusterIP: None
  selector:
    app: seaweedfs-s3
  ports:
    - name: s3
      port: 8333
    - name: master
      port: 9333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs-s3
spec:
  serviceName: seaweedfs-s3
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs-s3
  template:
    metadata:
      labels:
        app: seaweedfs-s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args:
            ["server", "-s3", "-volume.max=0", "-master.volumeSizeLimitMB=4096", "-ip", "localhost", "-ip.bind", "0.0.0.0"]
          ports:
            - containerPort: 8333
              name: s3
            - containerPort: 9333
              name: master
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 9333
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    # The S3 cold tier must outlive the pod; `emptyDir` discarded the bucket on
    # every restart.
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Bucket initialization: idempotent via s3cmd-free raw REST (PUT bucket).
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-bucket-init
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              set -e
              # SeaweedFS S3 accepts anonymous bucket creation on a fresh filer
              # with no auth configured (development endpoint only).
              for i in $(seq 1 30); do
                code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
                  "http://seaweedfs-s3:8333/ergo-cold" || true)
                [ "$code" = "200" ] && echo "bucket ready ($code)" && exit 0
                echo "waiting for S3 ($code)"; sleep 2
              done
              echo "bucket init failed" && exit 1
