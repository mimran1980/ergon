# Grafana: http://<host>:3000. Datasource and dashboards come from grafana/
# of this checkout, mounted into every node (deploy/kind.yaml): an edited
# dashboard shows on the next reload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.4.11
          env:
            # Pinned: its OTel trace mapping must match otel_traces' columns.
            - { name: GF_PLUGINS_PREINSTALL_SYNC, value: grafana-clickhouse-datasource@4.21.3 }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /lab/grafana/dashboards/market.json }
            - { name: GF_PATHS_PROVISIONING, value: /lab/grafana/provisioning }
            # Go returns memory to the OS near this, instead of at twice the heap.
            - { name: GOMEMLIMIT, value: 96MiB }
          ports: [{ containerPort: 3000 }]
          resources: { requests: { memory: 64Mi }, limits: { memory: 192Mi } }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          volumeMounts: [{ name: grafana, mountPath: /lab/grafana, readOnly: true }]
      volumes:
        - name: grafana
          hostPath: { path: /lab/grafana, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30300 }]
