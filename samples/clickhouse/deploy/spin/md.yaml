# One core for md. Its loop runs on NautilusTrader's callbacks and a 1 ms
# timer, so it has no idle strategy to set. Applied by `just spin`, not by
# `just up`.
spec:
  template:
    spec:
      containers:
        - name: md
          resources:
            requests:
              cpu: "1"
            limits:
              cpu: "1"
