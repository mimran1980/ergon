# Everything the lab runs, in namespace `lab`. Files under /lab come from this
# checkout (see kind.yaml), so edits on your machine reach the pods directly.
apiVersion: v1
kind: Namespace
metadata:
  name: lab
---
# ClickHouse. Query UI: http://<host>:8123/play (user lab, password lab).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: lab
spec:
  serviceName: clickhouse
  replicas: 1
  selector: { matchLabels: { app: clickhouse } }
  template:
    metadata: { labels: { app: clickhouse } }
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8
          env:
            - { name: CLICKHOUSE_USER, value: lab }
            - { name: CLICKHOUSE_PASSWORD, value: lab }
            - { name: CLICKHOUSE_DB, value: market }
            - { name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT, value: "1" }
          ports: [{ containerPort: 8123 }]
          # ClickHouse sizes its caches to what it may use: without a limit,
          # that is most of Docker's memory.
          resources: { limits: { memory: 2Gi } }
          readinessProbe:
            httpGet: { path: /ping, port: 8123 }
          volumeMounts: [{ name: data, mountPath: /var/lib/clickhouse }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: lab
spec:
  type: NodePort
  selector: { app: clickhouse }
  ports: [{ port: 8123, targetPort: 8123, nodePort: 30123 }]
---
# Aeron, one per node (a DaemonSet): the media driver and the archive in one
# JVM. Recorders and the ingester on the node share its directory, which is
# on the node's tmpfs, so every pod there talks to it over shared memory. The
# recordings are on the node's disk, so a restart loses nothing. If the
# archive dies (see deploy/LabDriver.java) the pod exits and is restarted,
# and the clients, whose driver is gone, exit and reconnect too.
#
# Timeouts are 30 s rather than Aeron's 10 s, so a laptop that sleeps
# briefly does not take everything down; AERON_DRIVER_TIMEOUT matches it on
# the Rust clients.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aeron
  namespace: lab
spec:
  selector: { matchLabels: { app: aeron } }
  template:
    metadata: { labels: { app: aeron } }
    spec:
      containers:
        - name: aeron
          image: lab/aeron:local
          imagePullPolicy: Never
          env:
            # 16 MiB segments, so the purge behind the ingester shows within minutes.
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -Daeron.dir=/aeron/driver -Daeron.dir.delete.on.start=true
                -Daeron.ipc.term.buffer.length=16m
                -Daeron.client.liveness.timeout=30s -Daeron.publication.unblock.timeout=45s
                -Daeron.driver.timeout=30000 -Daeron.archive.connect.timeout=30s
                -Daeron.archive.dir=/archive/recordings
                -Daeron.archive.segment.file.length=16m
                -Daeron.archive.control.channel=aeron:udp?endpoint=localhost:8010
                -Daeron.archive.replication.channel=aeron:udp?endpoint=localhost:0
          startupProbe:
            exec: { command: [test, -f, /aeron/driver/cnc.dat] }
            periodSeconds: 1
            failureThreshold: 120
          volumeMounts:
            - { name: aeron, mountPath: /aeron }
            - { name: archive, mountPath: /archive }
      volumes:
        - name: aeron
          hostPath: { path: /tmp/lab-aeron, type: DirectoryOrCreate }
        - name: archive
          hostPath: { path: /var/lib/lab/archive, type: DirectoryOrCreate }
---
# The ingester, one per node beside its Aeron: has the archive record the
# stream, replays it into ClickHouse, checkpoints, purges. Any archive error
# ends it; it restarts and resumes from its checkpoint. It ingests every SBE
# schema in schema/ of this checkout, read at start-up: after adding or
# changing one, `just ingester` restarts it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ingester
  namespace: lab
spec:
  selector: { matchLabels: { app: ingester } }
  template:
    metadata: { labels: { app: ingester } }
    spec:
      initContainers:
        - name: wait-for-aeron
          image: lab/recorder:local
          imagePullPolicy: Never
          command: [sh, -c, "until [ -f /aeron/driver/cnc.dat ]; do sleep 1; done"]
          volumeMounts: [{ name: aeron, mountPath: /aeron }]
      containers:
        - name: ingester
          image: lab/recorder:local
          imagePullPolicy: Never
          command: [/usr/local/bin/ingester]
          env:
            - { name: AERON_DIR, value: /aeron/driver }
            - { name: AERON_DRIVER_TIMEOUT, value: "30000" }
            - { name: CLICKHOUSE_URL, value: http://clickhouse:8123 }
            - { name: PERSIST_CONFIG, value: /lab/config/tables.yaml }
            - { name: PERSIST_SCHEMAS, value: /lab/schema }
            - { name: PERSIST_CHECKPOINT, value: /state/persist.checkpoint }
          volumeMounts:
            - { name: aeron, mountPath: /aeron }
            - { name: state, mountPath: /state }
            - { name: config, mountPath: /lab/config, readOnly: true }
            - { name: schema, mountPath: /lab/schema, readOnly: true }
      volumes:
        - name: aeron
          hostPath: { path: /tmp/lab-aeron, type: DirectoryOrCreate }
        - name: state
          hostPath: { path: /var/lib/lab/ingester, type: DirectoryOrCreate }
        - name: schema
          hostPath: { path: /lab/schema, type: Directory }
        - name: config
          hostPath: { path: /lab/config, type: Directory }
---
# The recorders, one Deployment per exchange, are in recorder.yaml:
# `just exchange okx` deploys one.
---
# Grafana: http://<host>:3000. Datasource and dashboards come from grafana/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: lab
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.4.11
          env:
            - { name: GF_PLUGINS_PREINSTALL_SYNC, value: grafana-clickhouse-datasource }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /lab/grafana/dashboards/market.json }
            - { name: GF_PATHS_PROVISIONING, value: /lab/grafana/provisioning }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
          volumeMounts: [{ name: grafana, mountPath: /lab/grafana, readOnly: true }]
      volumes:
        - name: grafana
          hostPath: { path: /lab/grafana, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: lab
spec:
  type: NodePort
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30300 }]
---
# JupyterLab: http://<host>:8888, notebooks/ from this checkout (read-write).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter
  namespace: lab
spec:
  replicas: 1
  selector: { matchLabels: { app: jupyter } }
  template:
    metadata: { labels: { app: jupyter } }
    spec:
      containers:
        - name: jupyter
          image: lab/jupyter:local
          imagePullPolicy: Never
          env:
            - { name: CLICKHOUSE_HOST, value: clickhouse }
          ports: [{ containerPort: 8888 }]
          volumeMounts:
            - { name: notebooks, mountPath: /lab/notebooks }
            - { name: config, mountPath: /lab/config, readOnly: true }
      volumes:
        - name: notebooks
          hostPath: { path: /lab/notebooks, type: Directory }
        - name: config
          hostPath: { path: /lab/config, type: Directory }
---
apiVersion: v1
kind: Service
metadata:
  name: jupyter
  namespace: lab
spec:
  type: NodePort
  selector: { app: jupyter }
  ports: [{ port: 8888, targetPort: 8888, nodePort: 30888 }]
