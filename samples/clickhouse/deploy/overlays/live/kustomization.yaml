apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      kind: StatefulSet
      name: binance
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--exchange", "binance", "--mode", "live", "--instance", "binance-0"]
  - target:
      kind: StatefulSet
      name: bybit
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--exchange", "bybit", "--mode", "live", "--instance", "bybit-0"]
# Live profile connects to public exchange feeds with ALL credential
# variables absent; start.sh verifies that before applying.
