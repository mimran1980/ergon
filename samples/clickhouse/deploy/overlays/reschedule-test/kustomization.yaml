apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
# Two-worker recovery test: mounts the same host test directory into both
# worker containers via kind extraMounts (see deploy/kind-reschedule.yaml)
# with a test-only static PV, then moves the binance pod between workers.
# This proves filesystem locking + WAL recovery on a shared host mount; it
# does NOT prove cross-host storage failover.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-test-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce", "ReadOnlyMany"]
  hostPath:
    path: /mnt/ergo-shared-test
  storageClassName: manual
