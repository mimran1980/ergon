# Four kind nodes, three regions. Feeds can move between the two an1 nodes.
#   an1  Tokyo        binance, hyperliquid
#   as1  Singapore    bybit, okx
#   ew2  London       deribit, kraken futures
# Every node runs Aeron and an ingester. `just up` mounts this checkout at /lab.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: clickhouse-lab
nodes:
  - role: control-plane
    labels: { topology.kubernetes.io/region: an1 }
    extraMounts:
      - hostPath: LAB_DIR
        containerPath: /lab
    extraPortMappings:
      - { containerPort: 30123, hostPort: 8123, listenAddress: 0.0.0.0 }  # ClickHouse HTTP + /play UI
      - { containerPort: 30300, hostPort: 3000, listenAddress: 0.0.0.0 }  # Grafana
      - { containerPort: 30888, hostPort: 8888, listenAddress: 0.0.0.0 }  # JupyterLab
  - role: worker
    labels: { topology.kubernetes.io/region: an1 }
    extraMounts:
      - hostPath: LAB_DIR
        containerPath: /lab
  - role: worker
    labels: { topology.kubernetes.io/region: as1 }
    extraMounts:
      - hostPath: LAB_DIR
        containerPath: /lab
  - role: worker
    labels: { topology.kubernetes.io/region: ew2 }
    extraMounts:
      - hostPath: LAB_DIR
        containerPath: /lab
