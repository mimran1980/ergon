# Everything the lab runs, in namespace lab. `just deploy` applies it
# (kubectl apply -k .). deploy/infra/ is plain Kubernetes YAML; the feed
# handler and the engine are each written once (deploy/md/base,
# deploy/trading/base), with a ten-line folder per exchange and per region
# naming it and pinning it to its region.
#
# To add an exchange: its line in config/streams.yaml, its venue in md's
# VENUES, a copy of deploy/md/binance/ with the exchange and region changed,
# and its line below.
namespace: lab
resources:
  - deploy/namespace.yaml
  # Shared by everything: ClickHouse, Aeron and an ingester per node,
  # Grafana, JupyterLab.
  - deploy/infra/clickhouse.yaml
  - deploy/infra/aeron.yaml
  - deploy/infra/ingester.yaml
  - deploy/infra/grafana.yaml
  - deploy/infra/jupyter.yaml
  # A feed handler per exchange, in its region.
  - deploy/md/binance
  - deploy/md/hyperliquid
  - deploy/md/bybit
  - deploy/md/okx
  - deploy/md/deribit
  - deploy/md/kraken
  # An engine and a dummy exchange per region.
  - deploy/trading/an1
  - deploy/trading/as1
  - deploy/trading/ew2
configMapGenerator:
  # config/: what is recorded (tables.yaml) and who publishes what
  # (streams.yaml). The applications re-read it while running, so it keeps
  # one name: a hashed name would restart every pod on each change.
  - name: lab-config
    files: [config/tables.yaml, config/streams.yaml]
    options: { disableNameSuffixHash: true }
  # ClickHouse's settings. Its name carries a hash of the file, so a change
  # restarts ClickHouse, which reads them only at start.
  - name: clickhouse-settings
    files: [lab.xml=deploy/infra/clickhouse.xml]
labels:
  - pairs: { app.kubernetes.io/part-of: lab }
