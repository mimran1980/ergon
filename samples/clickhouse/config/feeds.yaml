# Public feed selection for the sample. Products/symbols/capabilities
# only — no credentials, no private endpoints. Feed topology changes take
# effect on recorder restart; temporary-table diagnostics are controlled
# live by recording.yaml.
defaults:
  symbols:
    - BTC/USDT
    - ETH/USDT
  book_depth_output: 20
  poll_intervals:
    open_interest: 60s
    instrument_refresh: 300s

exchanges:
  binance:
    products:
      - spot
      - usdt_linear_perpetual
    capabilities:
      instruments: required
      trades: required
      quotes: required
      l2_deltas: required
      l2_book: required
      bars: required
      funding_rates: required
      mark_prices: required
      index_prices: required
      open_interest: optional
      liquidations: optional
      market_status: optional

  bybit:
    products:
      - spot
      - usdt_linear_perpetual
    capabilities:
      instruments: required
      trades: required
      quotes: required
      l2_deltas: required
      l2_book: required
      bars: required
      funding_rates: required
      mark_prices: optional
      index_prices: optional
      open_interest: optional
      liquidations: optional
      market_status: optional
