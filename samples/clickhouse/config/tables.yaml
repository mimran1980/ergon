# What gets recorded into ClickHouse. Edit and save: `enabled` applies within
# a second, no restart.
#
# A table named after a message in schema/ (market.xml, trading.xml) takes
# its columns from that message. Any other table is recorded from `tracing` events that name
# it (`tracing::info!(table = "spread", ...)`); its columns are their fields.
#
# kind: static   Created if missing, then never altered. If the table and the
#                data disagree, the ingester logs an ERROR with the ALTER to
#                run and keeps writing every column that still matches.
# kind: dynamic  Follows the data: a field added to market.xml becomes a new
#                column when its publisher restarts; a new event field, at once.
# enabled:       Record it now (default true): true, false, or
#                { until: 2026-09-27T18:00:00Z } for on until then (UTC).
# apps:          Per app (PERSIST_APP, here the exchange), the same values;
#                an app not listed takes `enabled`. For example, book
#                changes from Binance only, and from Deribit for an hour:
#                  book_deltas: { kind: dynamic, enabled: false,
#                                 apps: { binance: true, deribit: { until: 2026-09-27T18:00:00Z } } }
tables:
  trade:         { kind: static }
  quote:         { kind: static }
  mark_price:    { kind: dynamic, enabled: true }
  funding_rate:  { kind: dynamic, enabled: true }
  book_snapshot: { kind: dynamic, enabled: true }  # top 10 L2 levels a side, once a second
  index_price:   { kind: dynamic }
  bar:           { kind: dynamic }                 # one-minute bars from the venue
  book_deltas:   { kind: dynamic }                 # every order book change
  spread:        { kind: dynamic, enabled: true }
  instrument_spec: { kind: dynamic }  # how to read sizes, before each snapshot
  # The engines and dummy exchanges (schema/trading.xml).
  ema:           { kind: dynamic }  # each asset's EMAs, once a second
  agg_book:      { kind: dynamic }  # each asset's book across the region's venues, once a second
  new_order:     { kind: dynamic }
  execution_report: { kind: dynamic }
  # Event tables: their columns are whatever the rows bring.
  ticker:        { kind: dynamic }  # one row per instrument a second; each venue adds the columns it has
  book_view:     { kind: dynamic }  # a nested struct (record_value): spread.bps, bids.price arrays, an enum
  instrument:    { kind: dynamic }  # instrument definitions: tick size, fees, ...
  instrument_status: { kind: dynamic }
  # Traces (Grafana's trace view). Switched like any table, per app and until
  # a time; `traces` samples each by name: one in `sample`, plus every one
  # slower than `slower_than`. Metrics (tables `metrics`, `metrics_histogram`)
  # and Aeron's own counters (`aeron_*`) are always recorded.
  otel_traces:
    kind: static
    traces:
      book_update: { sample: 1000, slower_than: 100ms }
      # Every tick that led to an order is kept whatever these say.
      tick_to_trade: { sample: 10000, slower_than: 50ms }
      order_ack: { sample: 1 }
  # Data only one venue offers, named after its Nautilus type.
  deribit_volatility_index:  { kind: dynamic }  # DVOL
  hyperliquid_open_interest: { kind: dynamic }
  hyperliquid_public_trade:  { kind: dynamic }  # trades with buyer and seller addresses
