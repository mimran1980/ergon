# What gets recorded into ClickHouse. Edit and save: `enabled` applies within
# a second, no restart.
#
# A table named after a message in schema/market.xml takes its columns from
# that message. Any other table is recorded from `tracing` events that name
# it (`tracing::info!(table = "spread", ...)`); its columns are their fields.
#
# kind: static   Created if missing, then never altered. If the table and the
#                data disagree, the ingester logs an ERROR with the ALTER to
#                run and keeps writing every column that still matches.
# kind: dynamic  Follows the data: a field added to market.xml becomes a new
#                column when the recorder restarts; a new event field, at once.
# enabled:       Record it now (default true). Set false to stop recording.
#
# One exchange only: config/exchanges/<exchange>.yaml overrides `enabled` for
# that exchange's recorder, live. It may only name tables listed here:
#   tables:
#     book_deltas: { enabled: false }
tables:
  trade:         { kind: static }
  quote:         { kind: static }
  mark_price:    { kind: dynamic, enabled: true }
  funding_rate:  { kind: dynamic, enabled: true }
  book_snapshot: { kind: dynamic, enabled: true }  # top 10 L2 levels a side, once a second
  index_price:   { kind: dynamic }
  bar:           { kind: dynamic }                 # one-minute bars from the venue
  book_deltas:   { kind: dynamic }                 # every order book change
  spread:        { kind: dynamic, enabled: true }
  # Event tables: their columns are whatever the rows bring.
  ticker:        { kind: dynamic }  # one row per instrument a second; each venue adds the columns it has
  instrument:    { kind: dynamic }  # instrument definitions: tick size, fees, ...
  instrument_status: { kind: dynamic }
  # Data only one venue offers, named after its Nautilus type.
  deribit_volatility_index:  { kind: dynamic }  # DVOL
  hyperliquid_open_interest: { kind: dynamic }
  hyperliquid_public_trade:  { kind: dynamic }  # trades with buyer and seller addresses
