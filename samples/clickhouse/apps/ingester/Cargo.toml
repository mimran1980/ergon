[package]
name = "ingester"
description = "Central ingester: archive replay -> ClickHouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ingester"
path = "src/main.rs"

[[test]]
name = "lab_e2e"
path = "tests/lab_e2e.rs"

[dependencies]
ergo-clickhouse-persist = { workspace = true, features = ["ingest"] }
rusteron-archive = { workspace = true, optional = true }
rusteron-client = { workspace = true, optional = true }

rusqlite = { workspace = true }

[features]
archive = ["ergo-clickhouse-persist/archive", "dep:rusteron-archive", "dep:rusteron-client"]

[dev-dependencies]
support = { path = "../../tests/support" }
