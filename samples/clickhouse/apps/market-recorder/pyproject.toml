[project]
name = "market-recorder"
version = "0.1.0"
description = "Data-only NautilusTrader recording app for the clickhouse sample"
requires-python = ">=3.12"
dependencies = [
    "nautilus-trader==1.231.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "maturin>=1.7"]

[project.scripts]
market-recorder = "market_recorder.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
