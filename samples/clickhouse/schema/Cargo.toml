[package]
name = "schema"
description = "The lab's SBE schemas and the codecs generated from them."
version.workspace = true
edition.workspace = true
# The sample workspace's 1.98.1 floor is Nautilus's. This crate is generated
# codecs, and the root workspace builds it as a dev-dependency of the ingester
# tests on the repository toolchain.
rust-version = "1.88"
license.workspace = true
publish.workspace = true

[dependencies]
rust_decimal = "1"
# A root all-features build can enable these accessor families on the
# generator; its generated modules need the same runtime re-exports.
ergo-sbe = { workspace = true, features = ["compact_str", "smol_str", "bytes"] }

[build-dependencies]
ergo-sbe.workspace = true

[lints]
workspace = true
