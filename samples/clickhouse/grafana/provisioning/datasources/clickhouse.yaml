apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: lab
      defaultDatabase: md
      # Grafana's trace view reads otel_traces, the OpenTelemetry exporter's
      # layout that the ingester writes.
      traces:
        defaultDatabase: tracing
        defaultTable: otel_traces
        otelEnabled: true
        otelVersion: 1.29.0
    secureJsonData:
      # From the Secret `clickhouse`, through Grafana's environment.
      password: $CLICKHOUSE_PASSWORD
