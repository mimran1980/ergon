[package]
name = "ergo-clickhouse-persist"
description = "Private HFT-oriented persistence library: prepared recording, registration dictionaries, ClickHouse ingest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
rusteron-client = { workspace = true, optional = true }
rusteron-archive = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
ergo-sbe = { workspace = true, optional = true }
quote = { version = "1", optional = true }
proc-macro2 = { version = "1", optional = true }

[features]
default = ["config"]
config = ["dep:serde", "dep:serde_yaml"]
producer = ["dep:rusteron-client"]
archive = ["ingest", "producer", "dep:rusteron-archive"]
ingest = ["config", "dep:rusqlite", "dep:ureq"]
codegen = ["dep:ergo-sbe", "dep:quote", "dep:proc-macro2"]

[build-dependencies]
ergo-sbe = { workspace = true }

[dev-dependencies]
serial_test = "3"
ergo-clickhouse-persist-derive = { path = "../persist-derive" }

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[[test]]
name = "registration"
path = "tests/registration.rs"

[[test]]
name = "allocation"
path = "tests/allocation.rs"

[[test]]
name = "config_reload"
path = "tests/config_reload.rs"
required-features = ["config"]

[[test]]
name = "projections"
path = "tests/projections.rs"

[[test]]
name = "macros"
path = "tests/macros.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
required-features = ["ingest"]

[[test]]
name = "ingest_clickhouse"
path = "tests/ingest_clickhouse.rs"
required-features = ["ingest"]


[[test]]
name = "replay_pipeline"
path = "tests/replay_pipeline.rs"
required-features = ["ingest"]

[[test]]
name = "archive_replay"
path = "tests/archive_replay.rs"
required-features = ["archive"]

[[bench]]
name = "recording"
harness = false
