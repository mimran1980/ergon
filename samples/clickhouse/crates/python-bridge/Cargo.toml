[package]
name = "ergo-python-bridge"
description = "PyO3 extension exposing the prepared recorder to Python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ergo_recorder"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `archive` pulls in `producer` (Aeron publication) and `ingest` (the archive
# client), which the recorder pod needs: PLAN §9 has the app publishing over
# pod-local Aeron IPC into the pod's Archive, and the same process starts the
# recording because only it can reach that pod's shared memory.
ergo-clickhouse-persist = { workspace = true, features = ["config", "archive"] }
ergo-market-schema = { workspace = true }
# `ensure_recording` calls straight through to the archive client handle.
rusteron-archive = { workspace = true }
pyo3 = { version = "0.23" }

[features]
default = []
extension-module = ["pyo3/extension-module"]
