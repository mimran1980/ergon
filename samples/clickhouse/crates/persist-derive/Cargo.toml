[package]
name = "ergo-clickhouse-persist-derive"
description = "Derives and prepared-callsite macros for ergo-clickhouse-persist"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["derive"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
# Doctests in this crate expand to code that names the persist crate, so the
# examples can be compiled rather than left as unverified sketches.
ergo-clickhouse-persist = { path = "../persist" }
