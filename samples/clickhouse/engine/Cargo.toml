[package]
name = "engine"
description = "A regional trading engine (aggregated book, EMAs, orders) and its dummy exchange, on the lab's Aeron feeds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "exch-sim"
path = "src/bin/exch_sim.rs"

[[bin]]
name = "backtest"
path = "src/bin/backtest.rs"

[features]
clickhouse = ["ergon-runtime/clickhouse", "lab/clickhouse"]

[dependencies]
arrayvec = "0.7"
libm = "0.2"
log.workspace = true
mimalloc.workspace = true
schema.workspace = true
ergon-runtime.workspace = true
lab.workspace = true

[dev-dependencies]
# The live-journal test replays raw frames through a ClickHouse source.
ergon-runtime = { workspace = true, features = ["clickhouse"] }
proptest = "1.11"
rusteron-media-driver = { version = "0.2", features = ["static"] }

[lints]
workspace = true
