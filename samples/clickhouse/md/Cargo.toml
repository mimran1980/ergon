[package]
name = "md"
description = "A feed handler: one exchange's public market data via NautilusTrader, published as SBE on UDP feeds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrayvec = "0.7"
log.workspace = true
mimalloc.workspace = true
schema.workspace = true
ergon-runtime.workspace = true
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
nautilus-binance = "0.64"
nautilus-bybit = "0.64"
nautilus-common = "0.64"
nautilus-core = "0.64"
nautilus-deribit = "0.64"
nautilus-hyperliquid = "0.64"
nautilus-kraken = "0.64"
nautilus-okx = "0.64"
nautilus-live = "0.64"
nautilus-model = "0.64"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
