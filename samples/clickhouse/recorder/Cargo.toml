[package]
name = "recorder"
description = "Public Binance/Bybit market data via NautilusTrader, persisted with SBE."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrayvec = "0.7"
persist-client.workspace = true
rust_decimal = "1"
anyhow = "1"
nautilus-binance = "0.64"
nautilus-bybit = "0.64"
nautilus-common = "0.64"
nautilus-live = "0.64"
nautilus-model = "0.64"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[build-dependencies]
ergo-sbe.workspace = true

[lints]
workspace = true
