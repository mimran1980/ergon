[package]
name = "exchange-orderbook"
version = "0.1.0"
edition = "2024"
description = "Multi-exchange SBE orderbook demo — Bitget + Binance Spot with ErgoSBE codegen"
license = "MIT OR Apache-2.0"

[dependencies]
ergosbe = { path = "../../sbe" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rust_decimal = "1"
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
ergosbe = { path = "../../sbe" }
