[package]
name = "exchange-orderbook"
version = "0.1.0"
edition = "2024"
description = "Multi-exchange SBE orderbook demo — Bitget + Binance Spot with ErgoSBE codegen"
license = "MIT OR Apache-2.0"

[lib]
name = "exchange_orderbook"
path = "src/lib.rs"

[dependencies]
ergosbe = { path = "../../sbe" }
ergo-clickhouse-persist = { path = "../../persist", features = ["rust_decimal", "chrono"] }
ergo-clickhouse-persist-derive = { path = "../../persist/derive" }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
rust_decimal = "1"
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
bound-check-disabled = []

[lints.rust]
unused_comparisons = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_mut = "allow"
unused_assignments = "allow"
dead_code = "allow"
unexpected_cfgs = "allow"

[lints.clippy]
# Generated exchange code: suppress all clippy lints (same policy as workspace)
all = "allow"
pedantic = "allow"
nursery = "allow"

[build-dependencies]
ergosbe = { path = "../../sbe" }
