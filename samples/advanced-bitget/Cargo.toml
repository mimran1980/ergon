[package]
name = "advanced-bitget"
version = "0.1.0"
edition = "2024"
description = "Advanced sample: Bitget WS → AppMessage → Aeron IPC → ClickHouse"

[dependencies]
ergosbe = { path = "../../sbe", features = ["serde"] }
ergo-clickhouse-persist = { path = "../../persist" }
rusteron-client = "=0.2.1"
rusteron-media-driver = "=0.2.1"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["blocking"] }

[build-dependencies]
ergosbe = { path = "../../sbe" }

[[test]]
name = "roundtrip_test"
path = "tests/roundtrip_test.rs"

[[test]]
name = "ipc_roundtrip_test"
path = "tests/ipc_roundtrip_test.rs"

[[test]]
name = "allocation_test"
path = "tests/allocation_test.rs"

[[test]]
name = "clickhouse_e2e_test"
path = "tests/clickhouse_e2e_test.rs"

[[test]]
name = "clickhouse_persist_test"
path = "tests/clickhouse_persist_test.rs"

[[test]]
name = "dynamic_stream_test"
path = "tests/dynamic_stream_test.rs"

[[test]]
name = "e2e_deterministic_test"
path = "tests/e2e_deterministic_test.rs"

[[test]]
name = "bitget_state_test"
path = "tests/bitget_state_test.rs"

[features]
default = []
bound-check-disabled = []
serde = ["ergosbe/serde"]

[dev-dependencies]
tempfile = "3"
ctrlc = "3"
