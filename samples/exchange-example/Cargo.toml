[package]
name = "exchange-example"
version = "0.1.0"
edition = "2024"
description = "Multi-exchange IPC sample: Bitget WebSocket → Aeron IPC, with two exchanges' SBE schemas (+ domain objects / DTOs)"
publish = false

[dependencies]
# Exact: check-aeron-version reads this sample's (gitignored) lock, so a fresh
# resolve must stay on the aeron-pin release instead of floating to latest.
rusteron-client = "=0.3.0"
rusteron-media-driver = "=0.3.0"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"

[build-dependencies]
ergo-sbe = { path = "../../sbe" }
quote = "1"
proc-macro2 = "1"

[[test]]
name = "roundtrip_test"
path = "tests/roundtrip_test.rs"

[[test]]
name = "ipc_roundtrip_test"
path = "tests/ipc_roundtrip_test.rs"

[[test]]
name = "allocation_test"
path = "tests/allocation_test.rs"

[[test]]
name = "e2e_deterministic_test"
path = "tests/e2e_deterministic_test.rs"

[[test]]
name = "bitget_state_test"
path = "tests/bitget_state_test.rs"

[[test]]
name = "publication_test"
path = "tests/publication_test.rs"

[[test]]
name = "decimal_adapter_test"
path = "tests/decimal_adapter_test.rs"

[[test]]
name = "json_label_test"
path = "tests/json_label_test.rs"

[features]
default = []
bound-check-disabled = []

[dev-dependencies]
tempfile = "3"
ctrlc = "3"
