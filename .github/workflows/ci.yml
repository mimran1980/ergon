name: CI

# Auto-runs only on pushes to main. Use the "Run workflow" button
# (workflow_dispatch) to invoke it manually on any branch/commit — e.g. to
# validate first_cut before merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ripgrep (required by check-test-policy.sh)
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Prove test policy and reject suppressions
        run: |
          bash scripts/tests/test-test-policy.sh
          bash scripts/tests/test-quality-ratchets.sh
          bash scripts/tests/test-ci-network-and-coverage.sh
          bash scripts/tests/test-repository-hygiene.sh
          bash scripts/tests/test-bench-historic.sh
          bash scripts/tests/test-bench-ab.sh
          bash scripts/tests/test-stale-deny-ignores.sh
          bash scripts/tests/test-no-grep-q-pipefail.sh
          bash scripts/tests/test-cluster-ergo-sbe-features.sh
          bash scripts/tests/test-book-content.sh
          bash scripts/tests/test-generated-book.sh
          bash scripts/tests/test-rerun-if-changed.sh
          bash scripts/tests/test-aeron-version.sh
          bash scripts/tests/test-workflow-paths.sh
          bash scripts/tests/test-fix-sbe-conformance-pin.sh
          ./scripts/check-test-policy.sh
          ./scripts/check-ci-network-and-coverage.sh
          ./scripts/check-mutation-config.sh
          ./scripts/check-stale-deny-ignores.sh
          ./scripts/check-cluster-ergo-sbe-features.sh
          ./scripts/check-rerun-if-changed.sh
          ./scripts/check-workflow-paths.sh

  lint:
    needs: policy
    # x86_64 and aarch64 (Graviton): ergon-tune has code for each
    # architecture, and only the runner's architecture is compiled.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --exclude ergo-aeron-cluster --exclude ergo-aeron-cluster-test-harness -- -D warnings
      - run: cargo clippy -p ergo-aeron-cluster --all-targets -- -D warnings
      # rusteron's bundled Aeron and the aeron submodule pin are one release.
      # The check runs cargo metadata offline, which needs every platform's
      # crates (clippy fetches only this host's), so fetch them all first.
      - run: cargo fetch --locked
      - run: ./scripts/check-aeron-version.sh
      - run: cargo check --manifest-path sbe/fuzz/Cargo.toml --bins
      - run: cargo test --manifest-path sbe/miri-fixtures/Cargo.toml
      - run: RUSTDOCFLAGS='-D warnings' cargo doc -p ergo-sbe --all-features --no-deps
      - run: RUSTDOCFLAGS='-D warnings' cargo doc -p ergo-aeron-cluster --no-deps
      # The crate page is the crate's README (`#![doc = include_str!]`).
      - run: RUSTDOCFLAGS='-D warnings' cargo doc -p ergon-tune --all-features --no-deps
      # Generated codec surfaces match api/generated/*.txt (change tracking).
      - run: ./scripts/check-generated-public-api.sh

      # Gates that previously lived ONLY inside `just release`. Because a full
      # release takes hours and is rarely completed, breakage in these went
      # unnoticed — in 2026-08 four were found broken at once, three of them
      # already broken on main. They are seconds-to-minutes here.
      - name: Repository hygiene
        run: ./scripts/check-repository-hygiene.sh
      - name: Book fences allowlisted (rust,ignore drift)
        run: ./scripts/check-book-fences.sh
      - name: Book content checks
        run: ./scripts/check-book-content.sh
      - name: Generated book pages unedited (hashes, manifest, SUMMARY)
        run: ./scripts/check-generated-book.py
      # GitHub's runners ship Node.js; the check fails, not skips, without it.
      - name: Book animations (embeds, modules, node --check, offline, citations)
        run: ./scripts/check-book-anim.py
      - name: Performance page matches its benchmark artifacts
        run: python3 -I scripts/generate-performance-page.py --check && python3 -I scripts/tests/test-performance-page.py
      - name: sbe-tool benchmark comparators match upstream
        run: ./scripts/regenerate-sbe-benchmark-reference.sh --check
      # Self-test of the release's fail-closed evidence packaging. This one had
      # a path bug that made it impossible to pass, and its self-test asserted
      # the same wrong path — so the bug was invisible until a release reached
      # step 9/9. Run the self-test itself on every push.
      - name: Benchmark evidence packaging self-test
        run: bash scripts/test-package-bench-artifacts.sh

  test:
    needs: policy
    # x86_64 and aarch64 (Graviton): ergon-tune has code for each
    # architecture, and only the runner's architecture is compiled.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        # Three ergo-sbe shards split by measured time
        # (scripts/ci-test-weights.tsv) and everything else. Unsharded,
        # x86_64 took 2 h 54 min for the workspace step alone and hit this
        # timeout in the cluster tests.
        suite:
          - scripts/ci-test-shard.sh 1 3
          - scripts/ci-test-shard.sh 2 3
          - scripts/ci-test-shard.sh 3 3
          - scripts/ci-test-rest.sh
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      # Java 25 (LTS): the newest in Aeron 1.54.0's CI matrix (17, 21, 25);
      # its Gradle 9.8.2 runs on 17 to 27.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Install native build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y libbsd-dev uuid-dev curl

      - run: ${{ matrix.suite }}

  # Fail-fast gate: downstream jobs need this, so if policy, lint, or test
  # fails the gate is skipped and everything else is cancelled.
  gate:
    needs: [policy, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "gate passed"

  coverage:
    needs: gate
    runs-on: ubuntu-24.04
    # llvm-cov re-runs the whole ergo-sbe suite (lib and every test binary)
    # under instrumentation, at default test threads. It runs beside
    # aeron-cluster-integration after the gate and is shorter, so it is off
    # the critical path; sharding it would add a checkout and an instrumented
    # build per shard for no wall-time gain. If it grows long again, shard it
    # with `cargo llvm-cov --no-report` per shard and one `cargo llvm-cov
    # report` over the merged profiles: on one build that gives the same
    # per-file summary as this single run. The timeout must stay >= 90
    # (scripts/check-ci-network-and-coverage.sh).
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: llvm-tools

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce non-decreasing coverage
        run: ./scripts/check-coverage-ratchet.sh

  msrv:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSRV 1.99, the pinned toolchain (serial_test 4, a dev-dependency, needs
      # 1.93.1). Gate the publishable pure-Rust crate;
      # cluster (rusteron native build) is exercised on the primary toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - run: cargo +1.99.0 check -p ergo-sbe --all-targets --all-features
      - run: cargo +1.99.0 test -p ergo-sbe --lib --all-features

  aeron-cluster-integration:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      # Java 25, the newest LTS in Aeron 1.54.0's own CI matrix (17, 21, 25),
      # both builds the jars (Gradle 9.8.2 runs on 17 to 27; the classes are
      # Java 17 bytecode either way) and runs Archive and Cluster. The harness
      # takes java from JAVA_HOME, which setup-java sets.
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install native build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y libbsd-dev uuid-dev

      - name: Build Aeron jars
        run: cd aeron && ./gradlew :aeron-cluster:jar :aeron-archive:jar :aeron-all:jar :aeron-samples:jar

      - name: Harness clippy
        run: cargo clippy -p ergo-aeron-cluster-test-harness --all-targets -- -D warnings

      - name: Cluster integration tests
        run: cargo test -p ergo-aeron-cluster-test-harness -- --test-threads=1

      - name: Cluster HA sample
        run: |
          cd samples/cluster-ha-orderbook
          cargo check  # triggers build script
          cargo test --features test-harness -- --test-threads=1

      - name: Cluster tutorial sample (fmt, clippy, run)
        run: |
          cd samples/cluster-tutorial
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo run --quiet

  samples:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y libbsd-dev

      - name: Pre-build exchange-example (generates code before fmt)
        run: cd samples/exchange-example && cargo check


      - name: exchange-example (fmt, clippy, test)
        run: |
          cd samples/exchange-example
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -- --test-threads=1

      - name: cluster-ha-orderbook (fmt, clippy, test)
        run: |
          cd samples/cluster-ha-orderbook
          cargo check  # triggers build script
          cargo fmt     # format generated code
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib --test ha_offline_pipeline -- --test-threads=1

      - name: cluster-rfq (fmt, clippy)
        run: |
          cd samples/cluster-rfq
          cargo check  # triggers build script
          cargo fmt     # format generated code
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: l3-book
        run: cd samples/l3-book && cargo test -- --test-threads=1

      - name: sbe-feature-tour
        run: cd samples/sbe-feature-tour && cargo test -- --test-threads=1

  build:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - name: Install native build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y libbsd-dev

      - run: cargo build --release --workspace --exclude ergo-aeron-cluster --exclude ergo-aeron-cluster-test-harness
      - run: cargo build --release -p ergo-aeron-cluster

  # Thin compile check — full bench runs locally with `just bench`.
  bench:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - name: Install native build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y libbsd-dev

      - run: cargo bench -p ergo-sbe-benchmarks --no-run
      - run: cargo bench -p ergo-aeron-cluster --no-run

  package:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - run: cargo package -p ergo-sbe
      - run: cargo publish -p ergo-sbe --dry-run

  audit:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: cargo install cargo-deny cargo-audit --locked
      - run: cargo deny check
      - run: cargo audit

  # The Go module under k8s/nri-shared-cpus. The kind e2e stays local for
  # now: it needs >= 6 CPUs, GitHub's standard runner has 4.
  nri-shared-cpus:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: k8s/nri-shared-cpus
    steps:
      - uses: actions/checkout@v4

      # gofmt, go vet, go test -race and the amd64/arm64 static builds, in a
      # golang container with CAP_SYS_NICE: the hook tests write another
      # process's /proc/PID/timerslack_ns, which the runner user cannot.
      - name: unit lane (scripts/check.sh --unit)
        run: scripts/check.sh --unit

      # lab/lib.sh is sourced by an external AWS lab: its output shape is a contract.
      - name: lab quiet-settings test (lab/test/test-lib.sh)
        run: bash lab/test/test-lib.sh
      - name: gap probe unit tests
        run: cargo test --manifest-path lab/gapprobe/Cargo.toml
