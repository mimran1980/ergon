name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    # workflow_dispatch has no head_commit — short-circuit before contains()
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --exclude ergo-aeron-cluster -- -D warnings
      - run: cargo clippy -p ergo-aeron-cluster --all-targets -- -D warnings
      - run: cargo doc --no-deps --workspace

  test:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo test --workspace --all-features --exclude ergo-aeron-cluster -- --test-threads=2
      - run: cargo test -p ergo-aeron-cluster --lib
      - run: cargo test --doc
      - run: cargo test -p ergo-sbe --features bound-check-disabled -- --test-threads=1
      - run: cargo test -p ergo-sbe --test allocation_count_test -- --test-threads=1

  msrv:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo +1.95.0 check --workspace --all-targets --all-features --exclude ergo-aeron-cluster
      - run: cargo +1.95.0 check -p ergo-aeron-cluster --all-targets

  aeron-cluster-integration:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Aeron jars
        run: cd aeron && ./gradlew :aeron-cluster:jar :aeron-archive:jar :aeron-all:jar :aeron-samples:jar

      - name: Cluster integration tests
        run: cargo test -p ergo-aeron-cluster --features test-harness -- --test-threads=1

  samples:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: advanced-bitget (fmt, clippy, test)
        run: |
          cd samples/advanced-bitget
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -- --test-threads=1 --skip clickhouse

      - name: cluster-ha-orderbook (fmt, clippy, test)
        run: |
          cd samples/cluster-ha-orderbook
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib --test ha_offline_pipeline -- --test-threads=1

      - name: cluster-rfq (fmt, clippy)
        run: |
          cd samples/cluster_rfq
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

  clickhouse-live:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ergosbe
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/ping; then
              echo "ClickHouse ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Persist integration tests (live ClickHouse)
        run: cargo test -p ergo-clickhouse-persist --all-features -- --include-ignored --test-threads=1

      - name: advanced-bitget E2E (live ClickHouse)
        run: cd samples/advanced-bitget && cargo test --test clickhouse_e2e_test --test e2e_persist_test -- --include-ignored --test-threads=1 --nocapture

      - name: cluster-ha-orderbook latency (live ClickHouse)
        run: cd samples/cluster-ha-orderbook && cargo test --test ha_latency_clickhouse -- --include-ignored --test-threads=1 --nocapture

  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo build --release --workspace --exclude ergo-aeron-cluster
      - run: cargo build --release -p ergo-aeron-cluster

  bench:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo bench -p ergosbe-benchmarks
      - run: cargo bench -p ergo-aeron-cluster --no-run

  package:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo package -p ergo-sbe
      - run: cargo publish -p ergo-sbe --dry-run
