name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      # ergo-aeron-cluster's test-harness feature pulls the Java-building
      # ergo-aeron-cluster-test-support crate; lint the cluster lib (default
      # features) separately, and run its test-harness tests in the
      # aeron-cluster-integration job.
      - run: cargo clippy --workspace --all-targets --all-features --exclude ergo-aeron-cluster -- -D warnings
      - run: cargo clippy -p ergo-aeron-cluster --all-targets -- -D warnings
      - run: cargo doc --no-deps --workspace

  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      # NOTE: no --all-targets here — the workspace has criterion [[bench]]
      # targets; `cargo test --all-targets` would run them and criterion
      # rejects the test harness. Bench compilation is gated by the clippy
      # step (--all-targets, compile+lint only) and the bench job.
      - run: cargo test --workspace --all-features --exclude ergo-aeron-cluster
      - run: cargo test -p ergo-aeron-cluster --lib
      - run: cargo test --doc
      # Exercise the bound-check-disabled (unchecked fast-path) feature.
      - run: cargo test -p ergosbe --features bound-check-disabled -- --test-threads=1

  # Verify the declared MSRV (workspace.package.rust-version = 1.95). The floor
  # moved from 1.89 to 1.95 because ergo-aeron-cluster (rusteron edition 2024 /
  # let-chains) requires it. The cluster is excluded from the --all-features
  # check here (test-harness needs Java) and checked at default features.
  msrv:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo +1.95.0 check --workspace --all-targets --all-features --exclude ergo-aeron-cluster
      - run: cargo +1.95.0 check -p ergo-aeron-cluster --all-targets

  # ergo-aeron-cluster integration tests need Java 17+ and the Aeron jars built
  # from the `aeron` submodule. test-harness pulls the (excluded)
  # ergo-aeron-cluster-test-support crate, whose build.rs finds the jars at
  # ../aeron and compiles ClusterLauncher.java into aeron-samples.
  aeron-cluster-integration:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Aeron jars
        run: cd aeron && ./gradlew :aeron-cluster:jar :aeron-archive:jar :aeron-all:jar :aeron-samples:jar

      - name: Cluster integration tests
        run: cargo test -p ergo-aeron-cluster --features test-harness -- --test-threads=1

  # Samples are excluded from the workspace (own Cargo.lock each), so the
  # --workspace jobs above do not cover them. Gate them explicitly so API drift
  # cannot hide outside the workspace again. Live ClickHouse tests stay #[ignore]
  # and run via the dedicated just recipes locally.
  samples:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: advanced-bitget (fmt, clippy, test)
        run: |
          cd samples/advanced-bitget
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -- --test-threads=1 --skip clickhouse

      - name: exchange-orderbook (fmt, clippy, test)
        run: |
          cd samples/exchange-orderbook
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -- --test-threads=1

  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo build --release --workspace

  bench:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo bench --workspace
