name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --workspace

  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo test --workspace --all-targets --all-features
      - run: cargo test --doc
      # Exercise the bound-check-disabled (unchecked fast-path) feature.
      - run: cargo test -p ergosbe --features bound-check-disabled -- --test-threads=1

  # Verify the declared MSRV (workspace.package.rust-version). 1.89 is the
  # effective floor: ergo-clickhouse-persist -> clickhouse 0.15.1 needs 1.89+.
  msrv:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"

      - run: cargo +1.89.0 check --workspace --all-targets --all-features

  # Samples are excluded from the workspace (own Cargo.lock each), so the
  # --workspace jobs above do not cover them. Gate them explicitly so API drift
  # cannot hide outside the workspace again. Live ClickHouse tests stay #[ignore]
  # and run via the dedicated just recipes locally.
  samples:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: advanced-bitget (fmt, clippy, test)
        run: |
          cd samples/advanced-bitget
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets -- --test-threads=1 --skip clickhouse

      - name: exchange-orderbook (fmt, clippy, test)
        run: |
          cd samples/exchange-orderbook
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets -- --test-threads=1

  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo build --release --workspace

  bench:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo bench --workspace
