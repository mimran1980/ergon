name: CI

# Auto-runs only on pushes to main. Use the "Run workflow" button
# (workflow_dispatch) to invoke it manually on any branch/commit — e.g. to
# validate first_cut before merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ripgrep (required by check-test-policy.sh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Prove test policy and reject suppressions
        run: |
          bash scripts/tests/test-test-policy.sh
          bash scripts/tests/test-quality-ratchets.sh
          ./scripts/check-test-policy.sh
          ./scripts/check-mutation-config.sh

  lint:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --exclude ergo-aeron-cluster -- -D warnings
      - run: cargo clippy -p ergo-aeron-cluster --all-targets -- -D warnings
      - run: cargo check --manifest-path sbe/fuzz/Cargo.toml --bins
      - run: cargo test --manifest-path sbe/miri-fixtures/Cargo.toml
      - run: cargo doc --no-deps --workspace

  test:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev

      - run: ./scripts/regenerate-sbe-tool-reference.sh --check
      - run: ./scripts/regenerate-golden.sh --check
      - run: cargo test --workspace --all-features --exclude ergo-aeron-cluster -- --test-threads=2
      - run: cargo test -p ergo-aeron-cluster --lib
      - run: cargo test --doc

  # Fail-fast gate: downstream jobs need this, so if policy, lint, or test
  # fails the gate is skipped and everything else is cancelled.
  gate:
    needs: [policy, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo "gate passed"

  coverage:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: llvm-tools

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Enforce non-decreasing coverage
        run: ./scripts/check-coverage-ratchet.sh

  msrv:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSRV 1.88 (edition 2024 + let-chains). Gate the publishable pure-Rust crate;
      # cluster (rusteron native build) is exercised on the primary toolchain.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - run: cargo +1.88.0 check -p ergo-sbe --all-targets --all-features
      - run: cargo +1.88.0 test -p ergo-sbe --lib --all-features

  aeron-cluster-integration:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev uuid-dev

      - name: Build Aeron jars
        run: cd aeron && ./gradlew :aeron-cluster:jar :aeron-archive:jar :aeron-all:jar :aeron-samples:jar

      - name: Cluster integration tests
        run: cargo test -p ergo-aeron-cluster --features test-harness -- --test-threads=1

      - name: Cluster HA sample
        run: |
          cd samples/cluster-ha-orderbook
          cargo check  # triggers build script
          cargo test --features test-harness -- --test-threads=1

  samples:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev

      - name: Pre-build exchange-example (generates code before fmt)
        run: cd samples/exchange-example && cargo check


      - name: exchange-example (fmt, clippy, test)
        run: |
          cd samples/exchange-example
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test -- --test-threads=1

      - name: cluster-ha-orderbook (fmt, clippy, test)
        run: |
          cd samples/cluster-ha-orderbook
          cargo check  # triggers build script
          cargo fmt     # format generated code
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib --test ha_offline_pipeline -- --test-threads=1

      - name: cluster-rfq (fmt, clippy)
        run: |
          cd samples/cluster-rfq
          cargo check  # triggers build script
          cargo fmt     # format generated code
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: l3-book
        run: cd samples/l3-book && cargo test -- --test-threads=1

      - name: sbe-feature-tour
        run: cd samples/sbe-feature-tour && cargo test -- --test-threads=1

  # clickhouse-live: disabled — ergo-clickhouse-persist not yet published
  # Re-enable when the persist crate is ready.

  build:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev

      - run: cargo build --release --workspace --exclude ergo-aeron-cluster
      - run: cargo build --release -p ergo-aeron-cluster

  # Thin compile check — full bench runs locally with `just bench`.
  bench:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libbsd-dev

      - run: cargo bench -p ergo-sbe-benchmarks --no-run
      - run: cargo bench -p ergo-aeron-cluster --no-run

  package:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - run: cargo package -p ergo-sbe
      - run: cargo publish -p ergo-sbe --dry-run

  semver:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check ergo-sbe semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: Cargo.toml
          package: ergo-sbe

      - name: Check ergo-aeron-cluster semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: Cargo.toml
          package: ergo-aeron-cluster

  audit:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - run: cargo install cargo-deny cargo-audit --locked
      - run: cargo deny check
      - run: cargo audit
