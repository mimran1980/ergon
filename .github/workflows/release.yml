name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy, llvm-tools

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: extractions/setup-just@v2

      - name: Mandatory pre-release verification
        run: just release-check

      - name: Cache cargo-release binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-release
          key: cargo-release-${{ runner.os }}

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Configure git
        run: |
          git config user.name "Mo Imran"
          git config user.email "mohammed.imran@gsr.io"

      - name: Publish ergo-sbe
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_MULTIPLEXING: false
        run: |
          cargo release "${{ github.event.inputs.release_type }}" \
            -p ergo-sbe \
            --execute \
            --no-confirm \
            --verbose

      - name: Wait for crates.io index
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps 2>/dev/null \
            | jq -r '.packages[] | select(.name == "ergo-sbe") | .version')
          echo "Waiting for ergo-sbe $VERSION to appear on crates.io..."
          for i in $(seq 1 30); do
            if curl -sf "https://crates.io/api/v1/crates/ergo-sbe/$VERSION" >/dev/null 2>&1; then
              echo "ergo-sbe $VERSION is now available"
              break
            fi
            echo "  attempt $i/30 — waiting 10s..."
            sleep 10
          done
          if [ "$i" -eq 30 ]; then
            echo "ERROR: ergo-sbe $VERSION did not appear on crates.io within 5 minutes"
            exit 1
          fi

      - name: Publish ergo-aeron-cluster
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_MULTIPLEXING: false
        run: |
          cargo release "${{ github.event.inputs.release_type }}" \
            -p ergo-aeron-cluster \
            --execute \
            --no-confirm \
            --verbose

      - name: Push to GitHub
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          tags: true

      - name: Run SBE benchmarks (LTO + no-LTO)
        run: |
          just bench
          # Archive the run artifacts
          RUN_ID=$(ls -t target/bench-runs/ | head -1)
          echo "SBE run id: $RUN_ID"
          cp target/bench-runs/"$RUN_ID"/lto/criterion/estimates.json bench-sbe-lto.json
          cp target/bench-runs/"$RUN_ID"/no-lto/criterion/estimates.json bench-sbe-no-lto.json
          cp target/bench-runs/"$RUN_ID"/run-manifest.json run-manifest-sbe.json

      - name: Run cluster benchmarks (LTO + no-LTO)
        run: |
          just bench-cluster
          # Cluster benches write to target/criterion (default Criterion dir), not
          # target/bench-runs/ (which is SBE-only via scripts/run-sbe-bench.sh).
          cp target/criterion/estimates.json bench-cluster-lto.json
          cp target/bench-no-lto/criterion/estimates.json bench-cluster-no-lto.json
          echo "Cluster bench artifacts copied"

      - name: Build release artifacts
        run: cargo build --release --workspace

      - name: Extract version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps 2>/dev/null \
            | jq -r '.packages[] | select(.name == "ergo-sbe") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload SBE bench artifacts (LTO)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bench-sbe-lto.json
          asset_name: bench-sbe-lto-${{ steps.version.outputs.version }}.json
          asset_content_type: application/json

      - name: Upload SBE bench artifacts (no-LTO)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bench-sbe-no-lto.json
          asset_name: bench-sbe-no-lto-${{ steps.version.outputs.version }}.json
          asset_content_type: application/json

      - name: Upload cluster bench artifacts (LTO)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bench-cluster-lto.json
          asset_name: bench-cluster-lto-${{ steps.version.outputs.version }}.json
          asset_content_type: application/json

      - name: Upload cluster bench artifacts (no-LTO)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: bench-cluster-no-lto.json
          asset_name: bench-cluster-no-lto-${{ steps.version.outputs.version }}.json
          asset_content_type: application/json

      - name: Upload run manifests
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: run-manifest-sbe.json
          asset_name: run-manifest-sbe-${{ steps.version.outputs.version }}.json
          asset_content_type: application/json
