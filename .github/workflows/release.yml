name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy, llvm-tools

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: extractions/setup-just@v4

      - name: Mandatory pre-release verification
        run: just release-check

      - name: Run SBE benchmarks
        run: just bench

      - name: Run cluster benchmarks
        run: just bench-cluster

      - name: Package benchmark artifacts
        run: |
          mkdir -p release-assets
          bash scripts/package-bench-artifacts.sh release-assets

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Configure git
        run: |
          git config user.name "Mo Imran"
          git config user.email "mohammed.imran@gsr.io"

      - name: Publish ergo-sbe
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_MULTIPLEXING: false
        run: |
          cargo release "${{ github.event.inputs.release_type }}" \
            -p ergo-sbe --execute --no-confirm --verbose

      - name: Wait for crates.io index
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps 2>/dev/null \
            | jq -r '.packages[] | select(.name == "ergo-sbe") | .version')
          for i in $(seq 1 30); do
            if curl -sf "https://crates.io/api/v1/crates/ergo-sbe/$VERSION" >/dev/null 2>&1; then
              echo "ergo-sbe $VERSION available"
              break
            fi
            sleep 10
          done

      - name: Publish ergo-aeron-cluster
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_HTTP_MULTIPLEXING: false
        run: |
          cargo release "${{ github.event.inputs.release_type }}" \
            -p ergo-aeron-cluster --execute --no-confirm --verbose

      - name: Push to GitHub
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          tags: true

      - name: Extract version
        id: version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps 2>/dev/null \
            | jq -r '.packages[] | select(.name == "ergo-sbe") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: release-assets/*.tar.gz
          fail_on_unmatched_files: true
