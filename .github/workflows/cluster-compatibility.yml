name: Cluster Compatibility

# The cluster crate's codecs are *generated*, so a change under `sbe/src/`
# can break Aeron compatibility without touching a single file in `cluster/`.
# That is not hypothetical: 0.1.27 changed `sbe/src/codegen/` only, and this
# workflow stayed silent on the release commit while the equivalent check ran
# only in the local release gate. A gate that cannot fire is not a gate.
on:
  push:
    branches: [main]
    paths:
      - 'cluster/**'
      - 'cluster/schemas/**'
      - 'sbe/src/**'
      - '.github/workflows/cluster-compatibility.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cluster/**'
      - 'cluster/schemas/**'
      - 'sbe/src/**'
      - '.github/workflows/cluster-compatibility.yml'

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Java 21, not the 25 the other cluster jobs run: Aeron 1.46.8's
        # Gradle 8.10 predates Java 25 support, and that release was tested
        # on 17 and 21 only, so 21 is the newest it supports. The harness
        # takes java from JAVA_HOME.
        java: ["21"]
        aeron-version: ["1.46.8"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: extractions/setup-just@v4

      - name: Install native build dependencies
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y libclang-dev libbsd-dev

      - name: Check out Aeron ${{ matrix.aeron-version }}
        run: |
          cd aeron
          git fetch --tags
          git checkout "${{ matrix.aeron-version }}"
          cd ..

      - name: Build Aeron JARs
        run: just build-aeron-jars

      - name: Multi-node cluster tests
        run: just test-aeron-cluster-harness
