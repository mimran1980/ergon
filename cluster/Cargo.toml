[package]
name = "ergo-aeron-cluster"
version = "0.1.0"
edition = "2024"
description = "Experimental Ergo Aeron Cluster client (rusteron transport + ErgoSBE codecs)"
license = "Apache-2.0"
repository = "https://github.com/mimran1980/ErgoSBE"

[dependencies]
rusteron-client = { workspace = true }
ergo-aeron-cluster-test-support = { path = "../cluster-test-support", optional = true }

[features]
default = []
test-harness = ["ergo-aeron-cluster-test-support"]

[lib]
name = "ergo_aeron_cluster"
path = "src/lib.rs"

[[example]]
name = "echo_client"
required-features = ["test-harness"]

[[example]]
name = "auction_client"
required-features = ["test-harness"]

[[example]]
name = "rfq_client"
required-features = ["test-harness"]

[[example]]
name = "rfq_roundtrip"
required-features = ["test-harness"]

[[example]]
name = "async_connect_demo"
required-features = ["test-harness"]

[[example]]
name = "failover_demo"
required-features = ["test-harness"]

[dev-dependencies]
proptest = "1.11"
rusteron-media-driver = { workspace = true }
serial_test = { version = "3", features = ["file_locks"] }
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
ergo-sbe = { path = "../sbe" }

[[bench]]
name = "cluster_codec_bench"
harness = false
