[package]
name = "ergo-aeron-cluster"
version.workspace = true
edition = "2024"
description = "Experimental Ergo Aeron Cluster client (rusteron transport + ergo-sbe codecs)"
keywords = ["aeron", "aeron-cluster", "cluster", "sbe"]
categories = ["network-programming"]
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/mimran1980/ergon"
# Published package = product code only. Tests, benches, examples, and the
# reference sbe-tool tree are repo-only. The Java ClusterLauncher lives in
# the unpublished `ergo-aeron-cluster-test-harness` crate.
exclude = [
    "reference_sbe/",
    "Cargo.lock",
    "tests/",
    "benches/",
    "examples/",
]

[dependencies]
rusteron-client = { workspace = true }
thiserror = "2"
# Runtime dep for `sbe_mod!` (generated codecs live in OUT_DIR).
ergo-sbe = { workspace = true }

[features]
default = []

[lib]
name = "ergo_aeron_cluster"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1.11"
rusteron-media-driver = { workspace = true }
serial_test = { version = "3", features = ["file_locks"] }
criterion = { version = "0.8", features = ["html_reports"] }
trybuild = "1"

[build-dependencies]
ergo-sbe = { workspace = true }

[lints.rust]
missing_docs = "warn"

[[bench]]
name = "cluster_codec_bench"
harness = false
