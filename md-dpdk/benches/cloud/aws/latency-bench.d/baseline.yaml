# latency-pods lab: baseline mode (M0). Two Guaranteed pods
# (latency-bench-podrun.sh), hostNetwork (the veth path is not measured), one
# spinner per pod (HARNESS_DRIVER=invoker). The lab script fills __IMAGE__,
# __RUN__, __A_NODE__, __B_NODE__, __A_EP__, __B_EP__ (node internal IPs).
#
# baseline: plain emptyDir AERON_DIR, default seccomp, no extension
# annotations, no probe, SCHED_OTHER. The real A/B for latency is baseline vs
# hugepages vs partition vs probe vs all (latency-build-plan.md 9).
apiVersion: v1
kind: Pod
metadata:
  name: latency-__RUN__-pong
  namespace: ergon-latency-pods
  labels: { app: ergon-latency-pods, role: pong, mode: baseline, ergon.io/latency: "hot" }
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus","ergon-latency-pods-ext"]'
spec:
  nodeName: __B_NODE__
  restartPolicy: Never
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  terminationGracePeriodSeconds: 5
  priorityClassName: ergon-latency-pods-hot
  nodeSelector: { ergon.io/shared-cpus: "true" }
  containers:
    - name: app
      image: __IMAGE__
      imagePullPolicy: Never
      command: ["/latency-bench-podrun.sh", "pong", "__A_EP__", "__B_EP__"]
      env:
        - name: LATENCY_OUT
          value: /out
        - name: AERON_DIR
          value: /aeron
        - name: HARNESS_DRIVER
          value: invoker
        - name: RTT_SECONDS
          value: "60"
        - name: RTT_MESSAGES
          value: "300000"
        - name: RTT_WARMUP
          value: "50000"
      resources:
        requests: { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
        limits: { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
      volumeMounts:
        - { name: aeron, mountPath: /aeron }
        - { name: out, mountPath: /out }
  volumes:
    - { name: aeron, emptyDir: {} }
    - { name: out, emptyDir: {} }
---
apiVersion: v1
kind: Pod
metadata:
  name: latency-__RUN__-ping
  namespace: ergon-latency-pods
  labels: { app: ergon-latency-pods, role: ping, mode: baseline, ergon.io/latency: "hot" }
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus","ergon-latency-pods-ext"]'
spec:
  nodeName: __A_NODE__
  restartPolicy: Never
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  terminationGracePeriodSeconds: 5
  priorityClassName: ergon-latency-pods-hot
  nodeSelector: { ergon.io/shared-cpus: "true" }
  containers:
    - name: app
      image: __IMAGE__
      imagePullPolicy: Never
      command: ["/latency-bench-podrun.sh", "ping", "__A_EP__", "__B_EP__"]
      env:
        - name: LATENCY_OUT
          value: /out
        - name: AERON_DIR
          value: /aeron
        - name: HARNESS_DRIVER
          value: invoker
        - name: RTT_SECONDS
          value: "60"
        - name: RTT_MESSAGES
          value: "300000"
        - name: RTT_WARMUP
          value: "50000"
      resources:
        requests: { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
        limits: { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
      volumeMounts:
        - { name: aeron, mountPath: /aeron }
        - { name: out, mountPath: /out }
  volumes:
    - { name: aeron, emptyDir: {} }
    - { name: out, emptyDir: {} }
