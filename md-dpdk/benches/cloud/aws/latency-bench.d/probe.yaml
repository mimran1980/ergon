# latency-pods lab: probe mode (M5). The harm run. baseline plus a
# livenessProbe.exec every 1s. An exec probe runs inside the container and
# resets the container's CPU affinity (nri-spec 5.4); httpGet, tcpSocket and
# grpc run from outside and are fine. The admission extension (item 4)
# rejects exec liveness probes on pods labelled ergon.io/latency=hot, so this
# manifest deliberately does NOT carry that label: it is the before picture.
# The lab also runs this pod before the policy is applied, or with the label
# absent, so the probe is admitted and measured.
apiVersion: v1
kind: Pod
metadata:
  name: latency-__RUN__-pong
  namespace: ergon-latency-pods
  labels: { app: ergon-latency-pods, role: pong, mode: probe }
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus","ergon-latency-pods-ext"]'
spec:
  nodeName: __B_NODE__
  restartPolicy: Never
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  terminationGracePeriodSeconds: 5
  priorityClassName: ergon-latency-pods-hot
  nodeSelector: { ergon.io/shared-cpus: "true" }
  containers:
    - name: app
      image: __IMAGE__
      imagePullPolicy: Never
      command: ["/latency-bench-podrun.sh", "pong", "__A_EP__", "__B_EP__"]
      env:
        - name: LATENCY_OUT
          value: /out
        - name: AERON_DIR
          value: /aeron
        - name: HARNESS_DRIVER
          value: invoker
        - name: RTT_SECONDS
          value: "60"
        - name: RTT_MESSAGES
          value: "300000"
        - name: RTT_WARMUP
          value: "50000"
      livenessProbe:
        exec: { command: ["/bin/true"] }
        initialDelaySeconds: 5
        periodSeconds: 1
      resources:
        requests: { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
        limits: { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
      volumeMounts:
        - { name: aeron, mountPath: /aeron }
        - { name: out, mountPath: /out }
  volumes:
    - { name: aeron, emptyDir: {} }
    - { name: out, emptyDir: {} }
---
