[package]
name = "ergon-md-dpdk-harness"
version.workspace = true
edition.workspace = true
publish = false
description = "Unpublished DPDK interoperability harness for ergon-md-dpdk (scripts/test-dpdk-vdev.sh)"
license.workspace = true
repository.workspace = true

[[bin]]
# The vdev and AWS acceptance scripts run this binary by name.
name = "dpdk-harness"
path = "src/main.rs"

# The benchmark clients md-dpdk/benches/cloud runs against an external media driver
# (kernel UDP or DPDK), or one each embeds with HARNESS_DRIVER=invoker (src/lab.rs),
# ported from rusteron's x86 lab.
[[bin]]
name = "rtt"
path = "src/bin/rtt.rs"

[[bin]]
name = "load"
path = "src/bin/load.rs"

[[bin]]
name = "tput"
path = "src/bin/tput.rs"

# The raw floor: rtt's round trip with no Aeron, over kernel UDP or the DPDK
# transport's bindings alone (the lab's kernel-raw and dpdk-raw modes).
[[bin]]
name = "floor"
path = "src/bin/floor.rs"

[[bin]]
name = "clockcheck"
path = "src/bin/clockcheck.rs"

[[bin]]
name = "counters"
path = "src/bin/counters.rs"

# The transport latency suite's Aeron arms (IPC, spy, kernel UDP, DPDK: one
# binary against an external media driver), and its host check.
[[bin]]
name = "aeron_lat"
path = "src/bin/aeron_lat.rs"

[[bin]]
name = "hostcheck"
path = "src/bin/hostcheck.rs"

[dependencies]
env_logger = "0.11"
# The transport latency suite's shared message, clock, pacer, histograms and
# rows (io/benches/core, outside the workspace), as every other arm uses.
ergon-latency-core = { path = "../../io/benches/core" }
ergon-md-dpdk = { path = ".." }
hdrhistogram = "7.5"
libc = "0.2"
log = "0.4"
# The clients' clock (src/lab.rs): every latency stamp is its read after a
# fence. No `mock` override, so no thread-local check on a read.
quanta = { version = "0.13", default-features = false }
rusteron-client = { workspace = true }
rusteron-media-driver = { workspace = true }

[features]
# Off by default so the workspace and macOS build without the native DPDK
# toolchain. The vdev script enables it with `--features dpdk`, as must a
# build whose clients embed a DPDK driver (HARNESS_DRIVER=invoker with
# RUSTERON_MEDIA_DRIVER_TRANSPORT=dpdk-ena).
default = []
dpdk = ["ergon-md-dpdk/dpdk"]
# Statically link Aeron into the harness and the clients (the benchmark
# builds, which run the binaries directly, off cargo's library path).
static = ["ergon-md-dpdk/static", "rusteron-client/static", "rusteron-media-driver/static"]

[lints.rust]
missing_docs = "warn"
