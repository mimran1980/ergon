# Public API baseline — inventory of representative generated surfaces and
# the crates.io version cargo-semver-checks compares against.
#
# Enforced today: scripts/check-public-api.sh runs cargo-semver-checks on
# ergo-sbe and ergo-aeron-cluster against [metadata].baseline_tag (a git
# tag; the script strips a leading `v` before passing --baseline-version).
#
# Not enforced yet: compiling each fixture below, extracting its generated
# public API, and diffing that against the baseline tag. That generated-API
# freeze is future work for the 1.0 audit — this file is the fixture list,
# not a claim that the diff already runs.

[[fixtures]]
name = "car_full"
description = "Full-profile car example — primary API review artifact"
schema = "sbe/tests/fixtures/schemas/example-schema.xml"
profile = "Full"
generated_module = "car_example"

[[fixtures]]
name = "car_lean"
description = "Lean-profile car — minimal surface"
schema = "sbe/tests/fixtures/schemas/example-schema.xml"
profile = "Lean"
generated_module = "car_lean"

[[fixtures]]
name = "car_domain"
description = "Car with domain objects + conversions"
schema = "sbe/tests/fixtures/schemas/example-schema.xml"
profile = "Full"
generated_module = "car_domain"

[[fixtures]]
name = "multi_schema_shared"
description = "Multi-schema sharing — two schemas, shared common module"
schema = "sbe/tests/fixtures/schemas/multi-schema-a.xml"
profile = "Full"
generated_module = "multi_shared"
shared_schema = "sbe/tests/fixtures/schemas/multi-schema-b.xml"

[[fixtures]]
name = "cluster_session"
description = "Aeron cluster session schema 111"
schema = "cluster/schemas/aeron-cluster-codecs.xml"
profile = "Full"
generated_module = "session"
package = "ergo-aeron-cluster"

[metadata]
baseline_tag = "v0.1.17"
packages = ["ergo-sbe", "ergo-aeron-cluster"]
