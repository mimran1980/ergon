[package]
name = "ergosbe"
description = "Opinionated, idiomatic Rust code generation for Simple Binary Encoding."
keywords = ["sbe", "codegen", "binary", "protocol", "trading"]
categories = ["encoding", "parser-implementations", "development-tools"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
roxmltree = "0.20"
thiserror = "2"
miette = { version = "7", features = ["derive"] }
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"

[lints]
workspace = true
