[package]
name = "ergon-io-bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "TLS record, WebSocket and HTTP benchmarks for ergon-io"

[lib]
name = "io_bench"

[dependencies]
ergon-io = { path = ".." }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
libc = "0.2"
rcgen = "0.14"
hdrhistogram = "7"
httparse = "1.10"
aws-lc-rs = { version = "1.18", optional = true }
openssl = { version = "0.10", optional = true }
# The transport latency suite's shared message, clock, pacer, histograms,
# loss tracker, framing and rows.
ergon-latency-core = { path = "core" }
# The raw mio arms (src/transport/mio_*.rs) and the mio parity gate
# (parity/mio_parity.rs). `os-poll` and `net` are mio's Poll, UdpSocket and
# TcpStream.
mio = { version = "1", features = ["os-poll", "net"] }
# tcp_lat --source-port: a connecting socket bound to a fixed port, with
# SO_REUSEADDR and SO_LINGER before connect.
socket2 = "0.6"

# The transport latency suite's arms (src/transport/): each sends
# ergon-latency-core's 64-byte message on its schedule and prints its row.
[[bin]]
name = "mpsc_lat"
path = "src/bin/mpsc_lat.rs"

[[bin]]
name = "udp_lat"
path = "src/bin/udp_lat.rs"

[[bin]]
name = "tcp_lat"
path = "src/bin/tcp_lat.rs"

# TCP over F-Stack: needs F-Stack built by fstack/build-fstack.sh
# (FSTACK_PREFIX), which build.rs links. Linux x86_64 and aarch64.
[[bin]]
name = "fstack_lat"
path = "src/bin/fstack_lat.rs"
required-features = ["fstack"]

# ergon-io's fstack-spin measuring loop. Its own cargo invocation: combined
# with `fstack` it would link two DPDKs. The kernel peer (pong) does not
# start F-Stack.
[[bin]]
name = "fstack_spin_lat"
path = "src/bin/fstack_spin_lat.rs"
required-features = ["fstack-spin"]

# WebSocket-over-TLS on fstack-spin. The same cargo invocation as
# fstack_spin_lat. wstls_lat's smoltcp-dpdk build does not link F-Stack.
[[bin]]
name = "wstls_fstack_lat"
path = "src/bin/wstls_fstack_lat.rs"
required-features = ["fstack-spin"]

# TCP echo and WebSocket-over-TLS echo. Kernel `epoll-spin` links nothing
# extra. `fstack-spin` and `smoltcp-dpdk` are separate features: ergon-io
# refuses to link F-Stack's DPDK and the system's libdpdk into one binary.
[[bin]]
name = "wstls_lat"
path = "src/bin/wstls_lat.rs"

# The mio parity gate: a timed benchmark test, so it runs in release on its
# own lane (test-lanes.tsv, `just io-parity`), never in the debug test runs.
[[test]]
name = "mio_parity"
path = "parity/mio_parity.rs"
test = false

[features]
# fstack_lat and transport::fstack (build.rs links FSTACK_PREFIX's F-Stack)
fstack = []
# ergon-io's fstack-spin. Not combined with `fstack` in one cargo invocation:
# that links two copies of DPDK. `fstack_lat --impl ergon` names this backend.
fstack-spin = ["ergon-io/fstack"]
# ergon-io's smoltcp-spin (Linux x86_64 and aarch64). Off Linux the
# dependency compiles to nothing.
smoltcp-dpdk = ["ergon-io/smoltcp-dpdk"]
aws-lc = ["dep:aws-lc-rs", "rustls/aws_lc_rs"]
openssl = ["dep:openssl"]

[dev-dependencies]
ergon-io = { path = ".." }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }

[profile.release]
debug = 1
codegen-units = 1
lto = "fat"
panic = "abort"

# Its own workspace (the root one excludes io/benches). core/ is a member of
# the root workspace instead (md-dpdk/harness takes it by path from under
# `io`), so it is taken by path here as ergon-io is.
[workspace]
exclude = ["core"]
