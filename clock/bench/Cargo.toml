[package]
name = "ergon-clock-bench"
description = "Benchmarks for ergon-clock against quanta, minstant, std and the kernel's clocks: Criterion, and clockbench (CSV plus a readable table)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
# md-dpdk/benches/cloud/vm.sh clockbench runs this binary by name.
name = "clockbench"
path = "src/main.rs"

[[bench]]
name = "read"
harness = false

[dependencies]
ergon-clock = { version = "0.1.31", path = ".." }
libc = "0.2"
minstant = "0.1"
# quanta as users get it: default features (its `mock` adds a thread-local
# check to the global `quanta::Instant::now`)
quanta = "0.13"

[dev-dependencies]
criterion = "0.8"

[lints]
workspace = true
