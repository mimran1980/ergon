[workspace]
members = [
    "sbe",
    "sbe/benchmarks",
    "cluster",
    "cluster-test-harness",
    "runtime",
    "runtime-server",
]
# Excluded because they require nightly toolchain:
#   sbe/fuzz         — cargo-fuzz (libfuzzer), needs `cargo +nightly fuzz run`
#   sbe/miri-fixtures — cargo-miri, needs `cargo +nightly miri test`
#   samples           — standalone crates, not workspace members.
#     The ClickHouse lab links `ergon-runtime` and `ergon-runtime-server`
#     (this workspace) by path.
#
# Value:
#   fuzz — 6 targets hammering verify(), nested decode, AnyMessage dispatch,
#          bulk_decode, schema_parse, and flat group iteration with random
#          bytes. Catches panics in the trust boundary before they ship.
#   miri — 3 tests (LE fixed, BE fixed, nested group) under the Miri
#          interpreter. Catches UB in unsafe read_unaligned/write_unaligned
#          pointer casts that unit tests can't detect.
#
# Run with: just test-all
exclude = ["samples", "sbe/fuzz", "sbe/miri-fixtures"]
resolver = "3"

[workspace.package]
version = "0.1.30"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/mimran1980/ergon"
homepage = "https://github.com/mimran1980/ergon"
authors = ["Mohammed Imran"]

[workspace.dependencies]
# Inherited by the cluster crate, ergon-runtime and ergon-runtime-server, each
# for both edges. Cargo 1.95 rejects overriding default-features on an
# inherited dependency, so fancy is disabled here.
ergo-sbe = { version = "0.1.30", path = "sbe", default-features = false }
# The newest rusteron 0.2. Each crate needs `rusteron-code-gen` at exactly its
# own version, so all three resolve to one, and `cargo update` moves them
# together.
rusteron-client = "0.2"
rusteron-media-driver = "0.2"
rusteron-archive = { version = "0.2", features = ["static", "multi-threaded"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.bench]
lto = true
codegen-units = 1

[profile.release]
lto = true
codegen-units = 1
