[workspace]
members = [
    "sbe",
    "sbe/benchmarks",
    "cluster",
    "cluster-test-harness",
    "io",
    # Calibrated hardware-counter clock, and its benchmarks against quanta,
    # minstant, std and the kernel's clocks (clockbench, Criterion).
    "clock",
    "clock/bench",
    # Low-latency host and NIC checks (pure functions returning findings),
    # called by ergon-io, the media driver and downstream runtimes.
    "tune",
    # DPDK ENA kernel-bypass transport for the rusteron media driver. Its
    # `dpdk` feature is Linux x86_64 or aarch64 only, so `--all-features` runs
    # exclude it and the harness (see the justfile's dpdk recipes).
    "md-dpdk",
    "md-dpdk/harness",
    "md-dpdk/device-plugin",
]
# Excluded because they require nightly toolchain:
#   sbe/fuzz         — cargo-fuzz (libfuzzer), needs `cargo +nightly fuzz run`
#   sbe/miri-fixtures — cargo-miri, needs `cargo +nightly miri test`
#   samples           — standalone crates, not workspace members.
#
# Value:
#   fuzz — 6 targets hammering verify(), nested decode, AnyMessage dispatch,
#          bulk_decode, schema_parse, and flat group iteration with random
#          bytes. Catches panics in the trust boundary before they ship.
#   miri — 3 tests (LE fixed, BE fixed, nested group) under the Miri
#          interpreter. Catches UB in unsafe read_unaligned/write_unaligned
#          pointer casts that unit tests can't detect.
#
# Run with: just test-all
exclude = ["samples", "sbe/fuzz", "sbe/miri-fixtures", "io/benches"]
resolver = "3"

[workspace.package]
version = "0.1.30"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/mimran1980/ergon"
homepage = "https://github.com/mimran1980/ergon"
authors = ["Mohammed Imran"]

[workspace.dependencies]
# Inherited by the cluster crate for both edges. Cargo 1.95 rejects
# overriding default-features on an inherited dependency, so fancy is
# disabled here.
ergo-sbe = { version = "0.1.30", path = "sbe", default-features = false }
# rusteron 0.2.11 or newer 0.2. Each crate needs `rusteron-code-gen` at exactly its
# own version, so both resolve to one, and `cargo update` moves them together.
rusteron-client = "0.2.13"
rusteron-media-driver = "0.2.13"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.bench]
lto = true
codegen-units = 1

[profile.release]
lto = true
codegen-units = 1

# ergon-clock's tests optimised in every debug build (debug assertions and
# overflow checks stay on): its seqlock stress test (share.rs) only meets the
# reorderings a missing fence allows when reads are as tight as a release
# build's, and its discipline property tests run 20,000 trajectories.
[profile.dev.package.ergon-clock]
opt-level = 3
