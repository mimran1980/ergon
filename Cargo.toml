[workspace]
members = ["sbe", "sbe/benchmarks", "cluster"]
exclude = ["samples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/mimran1980/ergon"
homepage = "https://github.com/mimran1980/ergon"
authors = ["Mohammed Imran"]

# Single rusteron line for all members: ^0.2 (latest 0.2.x from crates.io).
# Excluded packages (samples) must use the same "0.2" string.
[workspace.dependencies]
rusteron-client = "0.2"
rusteron-media-driver = "0.2"
rusteron-archive = "0.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.bench]
lto = true
codegen-units = 1
[profile.release]
lto = true
codegen-units = 1
