# SPDX-License-Identifier: Apache-2.0
#
# ValidatingAdmissionPolicy for latency pods (item 4 of the latency-pod extension set).
# Scope: pods labelled ergon.io/latency: "hot". Built in to Kubernetes 1.30+,
# so no webhook and no fork.
#
# Rules (each names its fix in the message):
#   1. no livenessProbe or readinessProbe of type exec/command on a hot
#      container (an exec probe runs inside the container's cpuset and resets
#      the busy-spin loop's CPU affinity). httpGet, tcpSocket and grpc run from
#      outside the container and are fine.
#   2. no injected sidecar: no container and no init container with
#      restartPolicy: Always.
#   3. the ergon.io/shared-millicpus resource is requested (the plugin is the
#      only thing that can widen the cpuset and grant the latency set).
#   4. the required-plugins.noderesource.dev annotation names
#      ergon-shared-cpus (fail closed: without the plugin the create is
#      refused, never silently unconfigured).
#   5. a priorityClassName is set (preemption and eviction stop a hot pod
#      mid-trade; a PriorityClass is the no-fork answer).
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ergon-latency-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: latency-pod
      # Kubernetes CEL has no `??`. Guard the map and the key first: a missing
      # key is a runtime error, and a matchCondition error is a rejection.
      expression: >-
        has(object.metadata.labels) &&
        'ergon.io/latency' in object.metadata.labels &&
        object.metadata.labels['ergon.io/latency'] == 'hot'
  validations:
    # v1 validations have no name field (strict decoding rejects it). Each rule
    # is identified by its message.
    - expression: >-
        !has(object.spec.containers) ||
        object.spec.containers.all(c,
          !has(c.livenessProbe) ||
          !(has(c.livenessProbe.exec) || has(c.livenessProbe.command)))
      message: >-
        livenessProbe must not be exec/command on a hot pod. An exec probe runs
        inside the container and resets the busy-spin loop's CPU affinity
        (NRI createRuntime hook state). Use httpGet, tcpSocket or grpc, or drop
        the probe.
      reason: Forbidden
    - expression: >-
        !has(object.spec.containers) ||
        object.spec.containers.all(c,
          !has(c.readinessProbe) ||
          !(has(c.readinessProbe.exec) || has(c.readinessProbe.command)))
      message: >-
        readinessProbe must not be exec/command on a hot pod. An exec probe runs
        inside the container and resets the busy-spin loop's CPU affinity. Use
        httpGet, tcpSocket or grpc, or drop the probe.
      reason: Forbidden
    - expression: >-
        (!has(object.spec.containers) ||
         object.spec.containers.all(c, !has(c.restartPolicy) || c.restartPolicy != "Always")) &&
        (!has(object.spec.initContainers) ||
         object.spec.initContainers.all(c, !has(c.restartPolicy) || c.restartPolicy != "Always"))
      message: >-
        a container with restartPolicy: Always is an injected sidecar and is not
        allowed on a hot pod (it shares the pod's CPU budget and wakes on the hot
        core). Run sidecars in their own pod on the shared CPUs.
      reason: Forbidden
    - expression: >-
        has(object.spec.containers) &&
        object.spec.containers.exists(c,
          has(c.resources) &&
          (('ergon.io/shared-millicpus' in c.resources.limits) ||
           ('ergon.io/shared-millicpus' in c.resources.requests)))
      message: >-
        a hot pod must request ergon.io/shared-millicpus. That resource is what
        asks the ergon-shared-cpus plugin to widen the cpuset and grant the
        latency set. Add requests and limits for it, or drop the
        ergon.io/latency label.
      reason: Forbidden
    - expression: >-
        has(object.metadata.annotations) &&
        'required-plugins.noderesource.dev' in object.metadata.annotations &&
        object.metadata.annotations['required-plugins.noderesource.dev']
        .contains('ergon-shared-cpus')
      message: >-
        a hot pod must carry
        required-plugins.noderesource.dev: '["ergon-shared-cpus"]'. Without it
        the kubelet creates the pod with no plugin grants, which is a silent
        latency bug. Add the annotation, or drop the ergon.io/latency label.
      reason: Forbidden
    - expression: >-
        has(object.spec.priorityClassName) && object.spec.priorityClassName != ""
      message: >-
        a hot pod must set priorityClassName. Eviction and preemption stop a hot
        pod mid-trade. Point it at a dedicated high-priority class for hot pods
        (helpers use a class with preemptionPolicy: Never).
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ergon-latency-pods
spec:
  policyName: ergon-latency-pods
  validationActions: ["Deny"]
