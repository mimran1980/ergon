# SPDX-License-Identifier: Apache-2.0
# A hot pod the validating policy REJECTS: no priorityClassName. Eviction and
# preemption stop a hot pod mid-trade. Every other rule is satisfied, so the
# rejection names the missing priorityClassName.
---
apiVersion: v1
kind: Pod
metadata:
  name: latency-bad-no-priority
  namespace: ergon-latency-pods
  labels:
    ergon.io/latency: "hot"
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  containers:
    - name: app
      image: ergon-latency-pods-demo:e2e
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
        limits:   { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
