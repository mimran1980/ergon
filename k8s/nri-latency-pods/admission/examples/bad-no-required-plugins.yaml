# SPDX-License-Identifier: Apache-2.0
# A hot pod the validating policy REJECTS: no required-plugins.noderesource.dev
# annotation. Without it the kubelet creates the pod with no plugin grants,
# which is a silent latency bug. Every other rule is satisfied, so the
# rejection names the missing annotation.
---
apiVersion: v1
kind: Pod
metadata:
  name: latency-bad-no-required-plugins
  namespace: ergon-latency-pods
  labels:
    ergon.io/latency: "hot"
spec:
  priorityClassName: ergon-hot
  containers:
    - name: app
      image: ergon-latency-pods-demo:e2e
      command: ["sleep", "3600"]
      resources:
        requests: { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
        limits:   { cpu: "2", memory: 1Gi, ergon.io/shared-millicpus: "250" }
