#
# Capacity check: a small 250-millicpus pod used after the oversubscription
# change in step 17.
apiVersion: v1
kind: Pod
metadata:
  name: cap-check
  namespace: ergon-e2e
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  restartPolicy: Never
  nodeSelector:
    ergon.io/shared-cpus: "true"
  containers:
    - name: app
      image: ergon-nri-pin-test:e2e
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "1"
          memory: 32Mi
          ergon.io/shared-millicpus: "250"
        limits:
          cpu: "1"
          memory: 32Mi
          ergon.io/shared-millicpus: "250"
