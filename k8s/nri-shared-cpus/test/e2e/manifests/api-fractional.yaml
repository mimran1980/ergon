#
# API error: extended resources must be whole numbers. `kubectl apply` of this
# file must fail with "must be an integer".
apiVersion: v1
kind: Pod
metadata:
  name: api-fractional
  namespace: ergon-e2e
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  restartPolicy: Never
  nodeSelector:
    ergon.io/shared-cpus: "true"
  containers:
    - name: app
      image: ergon-nri-pin-test:e2e
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "1"
          memory: 32Mi
          ergon.io/shared-millicpus: "500m"
        limits:
          cpu: "1"
          memory: 32Mi
          ergon.io/shared-millicpus: "500m"
