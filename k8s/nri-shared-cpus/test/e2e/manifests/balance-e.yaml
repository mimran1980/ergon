#
# Balance pod E: cpu: 1, 250 millicpus. Started after A holds shared CPU 0,
# so it must get shared CPU 1.
apiVersion: v1
kind: Pod
metadata:
  name: e
  namespace: ergon-e2e
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  restartPolicy: Never
  nodeSelector:
    ergon.io/shared-cpus: "true"
  containers:
    - name: app
      image: ergon-nri-pin-test:e2e
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "1"
          memory: 32Mi
          ergon.io/shared-millicpus: "250"
        limits:
          cpu: "1"
          memory: 32Mi
          ergon.io/shared-millicpus: "250"
