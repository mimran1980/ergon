# Refusal: ERGON_SHARED_MILLICPUS set by hand, no resource requested.
apiVersion: v1
kind: Pod
metadata:
  name: refuse-env
  namespace: ergon-e2e
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  restartPolicy: Never
  nodeSelector:
    ergon.io/shared-cpus: "true"
  containers:
    - name: app
      image: ergon-nri-pin-test:e2e
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      env:
        - name: ERGON_SHARED_MILLICPUS
          value: "250"
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 32Mi
