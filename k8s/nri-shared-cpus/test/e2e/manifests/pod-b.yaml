#
# Pod B: a plain pod that only lists the plugin. While the plugin is down,
# containerd's default validator must refuse to create it.
apiVersion: v1
kind: Pod
metadata:
  name: b
  namespace: ergon-e2e
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  restartPolicy: Never
  nodeSelector:
    ergon.io/shared-cpus: "true"
  containers:
    - name: app
      image: ergon-nri-pin-test:e2e
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 10m
          memory: 32Mi
