# SPDX-License-Identifier: Apache-2.0
#
# Balance pod F: same as E. After E took shared CPU 1 the loads are 250/250,
# so the tie goes to the lower CPU number: F must get shared CPU 0.
apiVersion: v1
kind: Pod
metadata:
  name: f
  namespace: ergon-e2e
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  restartPolicy: Never
  nodeSelector:
    ergon.io/shared-cpus: "true"
  containers:
    - name: app
      image: ergon-nri-pin-test:e2e
      imagePullPolicy: Never
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "1"
          memory: 32Mi
          ergon.io/shared-millicpus: "250"
        limits:
          cpu: "1"
          memory: 32Mi
          ergon.io/shared-millicpus: "250"
