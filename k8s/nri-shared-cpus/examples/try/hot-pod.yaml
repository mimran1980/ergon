# SPDX-License-Identifier: Apache-2.0
#
# A hot pod the admission policy accepts and the plugin refuses on kind.
# A pod labelled ergon.io/latency: hot is checked against the node at
# create: each exclusive CPU must be in the kernel's isolated set (isolcpus).
# A kind node shares the host kernel and has none, so the create fails with
# "exclusive CPU not isolated". run.sh expects that refusal. On a node set
# up as in the README Quick start, this pod starts.
apiVersion: v1
kind: Pod
metadata:
  name: trader-hot
  namespace: trading
  labels:
    ergon.io/latency: "hot"
  annotations:
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  priorityClassName: ergon-hot
  # OnFailure, not Never. Never plus resizePolicy RestartContainer is
  # rejected by the API server before admission.
  restartPolicy: OnFailure
  nodeSelector:
    ergon.io/shared-cpus: "true"
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "2"
          memory: 64Mi
          ergon.io/shared-millicpus: "250"
        limits:
          cpu: "2"
          memory: 64Mi
          ergon.io/shared-millicpus: "250"
      resizePolicy:
        - resourceName: cpu
          restartPolicy: RestartContainer
