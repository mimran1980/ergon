# SPDX-License-Identifier: Apache-2.0
#
# Read-only Node GET, and only when the config names profiles. The plugin
# reads one node at startup. It does not watch and it does not write labels.
{{- if .Values.config.profiles }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ergon-shared-cpus.fullname" . }}
  namespace: {{ include "ergon-shared-cpus.namespace" . }}
  labels:
    {{- include "ergon-shared-cpus.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ergon-shared-cpus.fullname" . }}-node
  labels:
    {{- include "ergon-shared-cpus.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ergon-shared-cpus.fullname" . }}-node
  labels:
    {{- include "ergon-shared-cpus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ergon-shared-cpus.fullname" . }}-node
subjects:
  - kind: ServiceAccount
    name: {{ include "ergon-shared-cpus.fullname" . }}
    namespace: {{ include "ergon-shared-cpus.namespace" . }}
{{- end }}
