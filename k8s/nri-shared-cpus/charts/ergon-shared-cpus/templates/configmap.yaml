# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ergon-shared-cpus.fullname" . }}
  namespace: {{ include "ergon-shared-cpus.namespace" . }}
  labels:
    {{- include "ergon-shared-cpus.labels" . | nindent 4 }}
data:
  # cgroupRoot is not a key. The binary derives /sys/fs/cgroup. The parser
  # rejects an unknown field, so this file must not name it.
  config.yaml: |
{{- if .Values.config.profiles }}
{{- if not .Values.config.nodeProfileLabel }}
{{- fail "config.nodeProfileLabel is required when config.profiles is set" }}
{{- end }}
    nodeProfileLabel: {{ .Values.config.nodeProfileLabel | quote }}
    profiles:
{{- range $name, $p := .Values.config.profiles }}
{{- if not $p.sharedCpus }}
{{- fail (printf "profile %s needs sharedCpus" $name) }}
{{- end }}
      {{ $name }}:
{{- include "ergon-shared-cpus.configBody" $p | nindent 8 }}
{{- end }}
{{- else }}
{{- if .Values.config.nodeProfileLabel }}
{{- fail "config.profiles is required when config.nodeProfileLabel is set" }}
{{- end }}
{{- include "ergon-shared-cpus.configBody" .Values.config | nindent 4 }}
{{- end }}
