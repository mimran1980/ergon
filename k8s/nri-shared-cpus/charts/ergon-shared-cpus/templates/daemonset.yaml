# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ergon-shared-cpus.fullname" . }}
  namespace: {{ include "ergon-shared-cpus.namespace" . }}
  labels:
    {{- include "ergon-shared-cpus.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ergon-shared-cpus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ergon-shared-cpus.selectorLabels" . | nindent 8 }}
      {{- if .Values.layoutRevision }}
      # Operator-controlled replacement. A ConfigMap edit does not set this,
      # so it does not roll pods or migrate a live CPU layout.
      annotations:
        ergon.io/layout-revision: {{ .Values.layoutRevision | quote }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: system-node-critical
      {{- if .Values.config.profiles }}
      serviceAccountName: {{ include "ergon-shared-cpus.fullname" . }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: plugin
          image: {{ include "ergon-shared-cpus.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.config.profiles }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- end }}
          args:
            - --config
            - /etc/ergon-shared-cpus/config.yaml
            {{- if .Values.hostContract.kubeletConfig.enabled }}
            - --kubelet-config
            - /host/kubelet-config
            {{- end }}
            {{- if .Values.hostContract.kubeletConfigZ.enabled }}
            - --kubelet-configz
            - /host/kubelet-configz
            {{- end }}
            {{- if .Values.hostContract.kubeletOverrides.enabled }}
            - --kubelet-overrides
            - /host/kubelet-overrides
            {{- end }}
            {{- if .Values.hostContract.sys.enabled }}
            - --host-sys
            - /host/sys
            {{- end }}
            {{- if .Values.hostContract.proc.enabled }}
            - --host-proc
            - /host/proc
            {{- end }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          volumeMounts:
            - name: nri
              mountPath: /var/run/nri
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: hook-bin
              mountPath: /opt/ergon/bin
            - name: config
              mountPath: /etc/ergon-shared-cpus
              readOnly: true
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
            - name: host-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            {{- if .Values.hostContract.kubeletConfig.enabled }}
            - name: host-kubelet-config
              mountPath: /host/kubelet-config
              readOnly: true
            {{- end }}
            {{- if .Values.hostContract.kubeletConfigZ.enabled }}
            - name: host-kubelet-configz
              mountPath: /host/kubelet-configz
              readOnly: true
            {{- end }}
            {{- if .Values.hostContract.kubeletOverrides.enabled }}
            - name: host-kubelet-overrides
              mountPath: /host/kubelet-overrides
              readOnly: true
            {{- end }}
            {{- if .Values.hostContract.sys.enabled }}
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            {{- end }}
            {{- if .Values.hostContract.proc.enabled }}
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            {{- end }}
            {{- range .Values.extraHostPaths }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ .readOnly | default true }}
            {{- end }}
      volumes:
        - name: nri
          hostPath:
            path: /var/run/nri
            type: Directory
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: hook-bin
          hostPath:
            path: /opt/ergon/bin
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: {{ include "ergon-shared-cpus.fullname" . }}
        # The plugin stats the PHC and PM QoS device nodes to grant them (NRI
        # AddDevice needs the major/minor). The container's own /dev does not
        # carry them, so the host's /dev is mounted read-only at /host/dev and
        # the config points devRoot at it. Granted paths stay /dev/...
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        # The plugin reads the host cgroup tree. The container's own
        # /sys/fs/cgroup is this pod's cgroup namespace root, not the node's
        # hierarchy, so the pod cgroup's hugepage limit and the
        # cpuset.cpus.exclusive probe cannot be read there. The host's cgroup v2
        # is mounted read-only at /sys/fs/cgroup. That path is the binary's
        # derived cgroup root, not a YAML field (the parser rejects
        # cgroupRoot). The createRuntime hook matches it against
        # /proc/<pid>/cgroup. The plugin never writes this tree from inside
        # the pod: the cpu-partition writes are the ergon-cpus hook's, and
        # runc runs that hook on the node against the node's own mount.
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        {{- if .Values.hostContract.kubeletConfig.enabled }}
        - name: host-kubelet-config
          hostPath:
            path: {{ .Values.hostContract.kubeletConfig.path }}
            type: File
        {{- end }}
        {{- if .Values.hostContract.kubeletConfigZ.enabled }}
        - name: host-kubelet-configz
          hostPath:
            path: {{ .Values.hostContract.kubeletConfigZ.path }}
            type: File
        {{- end }}
        {{- if .Values.hostContract.kubeletOverrides.enabled }}
        - name: host-kubelet-overrides
          hostPath:
            path: {{ .Values.hostContract.kubeletOverrides.path }}
            type: {{ include "ergon-shared-cpus.hostPathType" .Values.hostContract.kubeletOverrides.type | trim }}
        {{- end }}
        {{- if .Values.hostContract.sys.enabled }}
        - name: host-sys
          hostPath:
            path: {{ .Values.hostContract.sys.path }}
            type: Directory
        {{- end }}
        {{- if .Values.hostContract.proc.enabled }}
        - name: host-proc
          hostPath:
            path: {{ .Values.hostContract.proc.path }}
            type: Directory
        {{- end }}
        {{- range .Values.extraHostPaths }}
        - name: {{ .name }}
          hostPath:
            path: {{ .path }}
            type: {{ .type | default "DirectoryOrCreate" }}
        {{- end }}
