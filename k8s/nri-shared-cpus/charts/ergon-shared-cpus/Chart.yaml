apiVersion: v2
name: ergon-shared-cpus
description: >-
  Give a Kubernetes pod its exclusive CPUs and the node's shared housekeeping
  CPUs. Containerd NRI plugin and kubelet device plugin in one daemon.
type: application
# Chart version in git. OCI chart 0.1.1 is published. EKS is not verified.
# Latency is not measured. The 0.1.1 package NOTES still say the chart is
# not published; that tag is not republished to change the note.
version: 0.1.1
# Default image tag for a render from this git tree.
appVersion: "0.1.1"
home: https://github.com/mimran1980/ergon/tree/main/k8s/nri-shared-cpus
sources:
  - https://github.com/mimran1980/ergon/tree/main/k8s/nri-shared-cpus
keywords:
  - nri
  - cpu-manager
  - cpuset
  - latency
  - latency-pods
maintainers:
  - name: Mohammed Imran
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: added
      description: >-
        Chart 0.1.1 renders every config.File field, repository@digest
        when image.digest is set, and an admission ownership switch.
        EKS is not verified. Latency figures are not measured.
