# SPDX-License-Identifier: Apache-2.0
apiVersion: v2
name: ergon-shared-cpus
description: >-
  Give a Kubernetes pod its exclusive CPUs and the node's shared housekeeping
  CPUs. Containerd NRI plugin and kubelet device plugin in one daemon.
type: application
# OCI chart 0.1.3. EKS verified at 0.1.2; 0.1.3 adds env exports only.
# Latency is not measured.
version: 0.1.3
# Default image tag. Image 0.1.3 adds the dpdk.ergon.io NIC pair and the
# Aeron hugepage env.
appVersion: "0.1.3"
home: https://github.com/mimran1980/ergon/tree/main/k8s/nri-shared-cpus
sources:
  - https://github.com/mimran1980/ergon/tree/main/k8s/nri-shared-cpus
keywords:
  - nri
  - cpu-manager
  - cpuset
  - latency
  - latency-pods
maintainers:
  - name: Mohammed Imran
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - kind: changed
      description: >-
        hostContract kubeletConfig, sys and proc are on by default, so a pod
        labelled ergon.io/latency: hot is checked against the node instead
        of refused with "kubelet configuration is not mounted". The kubelet
        file defaults to /var/lib/kubelet/config.yaml; the plugin pod does
        not start on a node without it.
    - kind: added
      description: >-
        hostContract.kubeletConfigDir (off by default) mounts the kubelet's
        --config-dir read-only and passes --kubelet-config-dir, so the
        hot-pod check merges the drop-ins as the kubelet does (EKS AL2023:
        /etc/kubernetes/kubelet/config.json.d). Needs image 0.1.2, the
        default.
