apiVersion: v1
kind: Namespace
metadata:
  name: ergon-system
  labels:
    # The DaemonSet writes hostPaths (the NRI socket, the device plugin
    # socket, the hook binary), which needs the privileged Pod Security
    # Standard.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
