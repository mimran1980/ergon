# SPDX-License-Identifier: Apache-2.0
#
# An opted-in Guaranteed pod: cpu: 2 = 2 isolated CPUs from the kubelet's
# static CPU manager; ergon.io/shared-millicpus: "250" = 1 shared housekeeping
# CPU (the quarter is scheduler accounting only; there is no hard cap).
apiVersion: v1
kind: Pod
metadata:
  name: trader
  namespace: trading
  annotations:
    # Fail closed: containerd's default validator refuses to create the
    # container while the plugin is down (containerd >= 2.2).
    required-plugins.noderesource.dev: '["ergon-shared-cpus"]'
spec:
  nodeSelector:
    ergon.io/shared-cpus: "true"
  # Opted-in containers should not use exec probes: kubectl exec and exec
  # probes start on any CPU of the cpuset, isolated ones included.
  containers:
    - name: app
      image: debian:trixie-slim
      command: ["sleep", "infinity"]
      resources:
        requests:
          cpu: "2"
          memory: 1Gi
          ergon.io/shared-millicpus: "250"
        limits:
          cpu: "2"
          memory: 1Gi
          ergon.io/shared-millicpus: "250"
      # In-place CPU resize would leave the CPU env stale: restart instead.
      resizePolicy:
        - resourceName: cpu
          restartPolicy: RestartContainer
