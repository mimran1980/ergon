# SPDX-License-Identifier: Apache-2.0
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ergon-shared-cpus
  namespace: ergon-system
  labels:
    app: ergon-shared-cpus
spec:
  selector:
    matchLabels:
      app: ergon-shared-cpus
  template:
    metadata:
      labels:
        app: ergon-shared-cpus
    spec:
      nodeSelector:
        ergon.io/shared-cpus: "true"
      tolerations:
        - operator: Exists
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      containers:
        - name: plugin
          image: ergon-shared-cpus:dev
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/ergon-shared-cpus/config.yaml
            - --kubelet-config
            - /host/kubelet-config
            - --host-sys
            - /host/sys
            - --host-proc
            - /host/proc
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          ports:
            - name: metrics
              containerPort: 9466
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          volumeMounts:
            - name: nri
              mountPath: /var/run/nri
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: hook-bin
              mountPath: /opt/ergon/bin
            - name: config
              mountPath: /etc/ergon-shared-cpus
              readOnly: true
            - name: host-dev
              mountPath: /host/dev
              readOnly: true
            - name: host-cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: host-kubelet-config
              mountPath: /host/kubelet-config
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
      volumes:
        - name: nri
          hostPath:
            path: /var/run/nri
            type: Directory
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: hook-bin
          hostPath:
            path: /opt/ergon/bin
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: ergon-shared-cpus
        # The plugin stats the PHC and PM QoS device nodes to grant them (NRI
        # AddDevice needs the major/minor). The container's own /dev does not
        # carry them, so the host's /dev is mounted read-only at /host/dev and
        # the config points devRoot at it. Granted paths stay /dev/...
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        # The plugin reads the host cgroup tree. The container's own
        # /sys/fs/cgroup is this pod's cgroup namespace root, not the node's
        # hierarchy, so the pod cgroup's hugepage limit and the
        # cpuset.cpus.exclusive probe cannot be read there. The host's cgroup v2
        # is mounted read-only at /sys/fs/cgroup. That path is the binary's
        # derived cgroup root, not a YAML field (the parser rejects
        # cgroupRoot). The createRuntime hook matches it against
        # /proc/<pid>/cgroup. The plugin never writes this tree from
        # inside the pod: the cpu-partition writes are the ergon-cpus hook's,
        # and runc runs that hook on the node against the node's own mount.
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        # Hot creates read cpuManagerPolicy and reservedSystemCPUs from this
        # file. An empty --kubelet-config refuses those creates. File, not
        # FileOrCreate: a missing path fails the pod instead of mounting an
        # empty file the plugin would trust. The chart mounts the same path
        # by default (hostContract.kubeletConfig). A kubelet run with
        # --config-dir (EKS AL2023: /etc/kubernetes/kubelet/config.json plus
        # config.json.d) also needs that directory mounted and passed as
        # --kubelet-config-dir (the chart's hostContract.kubeletConfigDir).
        - name: host-kubelet-config
          hostPath:
            path: /var/lib/kubelet/config.yaml
            type: File
        # The node's sysfs and proc for the hot-create contract: isolated and
        # nohz_full CPUs, NIC inventory and IRQ affinity. The container's own
        # /sys/class/net lists the pod's network namespace, not the node's
        # NICs. Same as the chart's hostContract.sys and hostContract.proc.
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
