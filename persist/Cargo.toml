[package]
name = "ergo-clickhouse-persist"
description = "Debugging persistence: auto-persist annotated structs to ClickHouse with dynamic schema management"
keywords = ["clickhouse", "persistence", "debugging", "sbe", "trading"]
categories = ["database", "development-tools", "debugging"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
rust_decimal = ["dep:rust_decimal"]
chrono = ["dep:chrono"]
serde = []

[dependencies]
clickhouse = { version = "0.15", default-features = false, features = ["lz4", "rustls-tls"] }
chrono = { version = "0.4", optional = true, features = ["now"] }
log = "0.4"
rust_decimal = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1"] }
hyper = { version = "1", features = ["http1", "client"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rustls-pemfile = "2"
hyper-rustls = { version = "0.27", default-features = false, features = ["webpki-tokio"] }

[dev-dependencies]
chrono = { version = "0.4", features = ["now"] }
clickhouse = { version = "0.15", default-features = false }
ergo-clickhouse-persist-derive = { path = "derive" }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }

[build-dependencies]
ergo-sbe = { path = "../sbe" }

# NOTE: inherited workspace lints are deliberately omitted here.
# The generated SBE code contains unsafe blocks (opt-in _unchecked methods)
# which would conflict with the workspace's `unsafe_code = "forbid"` lint.
