[package]
name = "ergosbe-benchmarks"
description = "ErgoSBE benchmarks — generates SBE codecs on-the-fly via build.rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
ergosbe = { path = "../sbe" }
serde = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
ergosbe = { path = "../sbe" }

[[bench]]
name = "decode_bench"
harness = false

[[bench]]
name = "encode_bench"
harness = false

[[bench]]
name = "throughput_bench"
harness = false

[[bench]]
name = "perf_parity_bench"
harness = false

[features]
default = []
bound-check-disabled = []
serde = ["dep:serde", "ergosbe/serde"]

[lints]
workspace = true
